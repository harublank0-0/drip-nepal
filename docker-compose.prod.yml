# Production stack for a single VPS: app + Postgres + Caddy (automatic HTTPS).
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See DEPLOY.md.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    expose:
      - '3333'

  postgres:
    image: docker.io/postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: docker.io/caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

# Caddy and the app share this subnet; the app trusts X-Forwarded-For only
# from it (TRUSTED_PROXY_CIDRS, docs/11 §3.4).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
