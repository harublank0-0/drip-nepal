allowBuilds:
  '@swc/core': true
  esbuild: true
minimumReleaseAgeExclude:
  - framer-motion@12.41.0
  - motion-dom@12.41.0
overrides:
  # 14.1.0 validates app commands with a schema that has no $id, which
  # Node 24's URL parser rejects ("Invalid URL"): every `node ace` command
  # fails to boot while commands/ holds a command. Fixed in 14.1.1. Remove
  # once @adonisjs/core requires >=14.1.1.
  '@adonisjs/ace': 14.1.1
# Advisories `pnpm audit` ignores (docs/09 §10.3). Each has a row with its
# reason, who accepted it and an expiry date in security/audit-exceptions.md;
# T-SEC-038 fails when the two lists differ or a date has passed.
auditConfig:
  ignoreGhsas:
    - GHSA-v53p-9fqp-m79j
    - GHSA-prgh-xp8r-p3m5
