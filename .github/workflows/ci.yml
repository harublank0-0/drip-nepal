# CI for the repository: the stages of docs/10 §5.1 that exist in M0, each a
# job whose name is the required status check on `main` (docs/10 §5.4,
# docs/11 §5.2). Runs on pushes to main and on pull requests into it.
# Nothing is deployed; release.yml builds the image after a green run on main.
# It also runs on pull requests into feat/e4-schema-baseline, the E4
# integration branch (docs/12 §4.1, docs/09 §8.1), and on demand
# (workflow_dispatch): retargeting a stacked pull request onto that branch
# starts no run, so a run can be started by hand for the branch.
# Actions are pinned by commit SHA; the release tag is in the comment. No
# secrets are used: the Supply chain job reads the pull request's labels with
# the run's own token.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/e4-schema-baseline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What booting the application needs in CI. NODE_ENV=test adds .env.test,
# which holds the fixed test keys; the database values match the Tests job's
# service container. Jobs that boot the app also get a throwaway APP_KEY.
env:
  TZ: UTC
  PORT: 3333
  HOST: localhost
  LOG_LEVEL: warn
  APP_URL: http://localhost:3333
  SESSION_DRIVER: database
  DRIVE_DISK: fs
  LIMITER_STORE: database
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: dripnepal_app
  DB_PASSWORD: secret
  DB_DATABASE: dripnepal_test
  DB_MIGRATOR_USER: dripnepal_migrator
  DB_MIGRATOR_PASSWORD: secret

jobs:
  # docs/10 §5.1 Static: frozen install, Prettier, ESLint with zero warnings
  # (its fixtures are T-ARCH-021 and T-UI-029, in the unit suite), both
  # typechecks, the unit suite, and the production build.
  static:
    name: Static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint, zero warnings
        run: pnpm lint
      - name: Typecheck (server and inertia)
        run: pnpm typecheck
      # The unit suite needs no database. It holds the lint fixtures
      # (T-ARCH-014, T-ARCH-021, T-SEC-016, T-UI-029) and the tests of every
      # check script below, so a check that stops failing fails here.
      - name: App key for the unit suite
        run: echo "APP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Unit suite
        run: node ace test unit
      # Compiles the server and builds the client and SSR bundles, so a
      # missing SSR bundle (every page would answer 500) fails here.
      - name: Production build
        run: |
          node ace build
          test -f build/public/assets/server/.vite/manifest.json
          test -f build/public/assets/server/ssr.js
      # docs/08 §10.1: T-UI-012 (initial JavaScript per route within budget),
      # T-UI-013 (no devtools strings) and T-ARCH-002's build-output part (the
      # SSR bundle holds only the server-rendered surfaces).
      - name: T-UI-012, T-UI-013 and T-ARCH-002 bundle checks
        run: node scripts/check_bundle.mjs

  # docs/10 §5.1 Repository. T-ARCH-016 runs in the Tests job, after the
  # suites have regenerated .adonisjs/.
  repository:
    name: Repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # docs/09 §2.4: dependency-cruiser over app/, start/ and database/
      # (T-SEC-016 is its rule 8), then the raw-SQL owner-writes scan.
      - name: T-ARCH-001 module rules
        run: pnpm lint:arch
      - name: T-ARCH-029 docs links, ADR sections and index
        run: node scripts/check_docs.mjs
      - name: T-ARCH-030 portability (every tracked file)
        run: node scripts/check_portability.mjs
      - name: T-ARCH-033 test IDs are registered
        run: node scripts/check_test_ids.mjs
      - name: T-UI-024 notices file matches ui/ and kit/
        run: node scripts/check_notices.mjs

  # docs/10 §5.1 Supply chain (docs/07 §7.1, §7.2).
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # the labels, for the lockfile rule of T-SEC-026
    steps:
      # The whole history: the secret scan reads every blob, and the
      # lockfile rule diffs against the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: T-SEC-025 secret scan over the full history
        run: node scripts/scan_secrets.mjs
      # No --ignore-registry-errors: a registry outage shows as a failure
      # (docs/09 §10.3). Ignored advisories are listed in pnpm-workspace.yaml.
      - name: T-SEC-026 advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: T-SEC-038 advisory exceptions agree and are current
        run: node scripts/check_audit_exceptions.mjs
      # The labels are read when the job runs, so a maintainer who adds
      # `dependencies` can re-run this job instead of pushing again.
      - name: T-SEC-026 lockfile sources, registries and lockfile-only changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
            node scripts/check_dependency_policy.mjs --base "origin/$BASE_REF" --labels "$labels"
          else
            node scripts/check_dependency_policy.mjs
          fi

  # docs/10 §5.1 Contract (docs/09 §4.5).
  contract:
    name: Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: App key for the run
        run: echo "APP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: T-API-009 OpenAPI lint
        run: pnpm lint:openapi
      # Reads `node ace list:routes --json`, which boots the app without a
      # database connection.
      - name: T-API-010 route parity
        run: node scripts/check_api_contract.mjs
      # Lists the routes twice, in development and in production, with
      # placeholder settings and throwaway keys it sets itself.
      - name: T-SEC-005, T-SEC-037, T-UI-025 and T-UI-026 route rules
        run: node scripts/check_routes.mjs
      # `--files` with a path that matches nothing prints "NO TESTS EXECUTED"
      # and exits 0, so the step also requires a passed-test count.
      - name: T-API-011 problem-code registry
        run: |
          set -o pipefail
          node ace test unit --files tests/unit/exceptions/problem_codes.spec.ts | tee "$RUNNER_TEMP/t-api-011.log"
          grep -Eq 'Tests +[1-9][0-9]* passed' "$RUNNER_TEMP/t-api-011.log"

  # docs/10 §5.1 Database, Functional and Concurrency: the suites against
  # PostgreSQL 18.4, the production version (docs/10 §3.2). The test runner
  # rebuilds the dripnepal_test database at the start of every run, as
  # dripnepal_migrator, and the suites run as dripnepal_app (docs/07
  # §4.10). The image's superuser, postgres, only creates those roles.
  # SeaweedFS, from the development Compose file, is the S3 server of
  # T-MED-005 (OD-65).
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: dripnepal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dripnepal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # A throwaway key for this run only; it signs nothing that outlives it.
      - name: App key for the test run
        run: echo "APP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      # docs/07 §4.10 and docs/09 §6.1 "Test roles": the migrator owns the
      # test database, so it holds CREATE on it for the CREATE EXTENSION of
      # baseline file 1 (docs/04 §20.2.2) and owns schema public through
      # pg_database_owner; dripnepal_app gets only what baseline_grants grants.
      - name: Database roles
        env:
          PGPASSWORD: secret
        run: |
          psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U postgres -d "$DB_DATABASE" <<'SQL'
          CREATE ROLE dripnepal_migrator LOGIN PASSWORD 'secret' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE dripnepal_app LOGIN PASSWORD 'secret' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE dripnepal_readonly LOGIN PASSWORD 'secret' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT pg_read_all_stats TO dripnepal_readonly;
          ALTER DATABASE dripnepal_test OWNER TO dripnepal_migrator;
          SQL
      # T-ARCH-017 (docs/09 §8.4, §8.2): migration file names and first
      # statements. database/migrations.lock does not exist until the first
      # production deploy, so the script runs in file-name mode (docs/12
      # §4.3 item 2); from then on it also compares checksums.
      - name: T-ARCH-017 migration lock (file-name mode)
        run: node scripts/check_migrations_lock.mjs
      # T-ARCH-034 (ADR-0016 decision 2, docs/11 §1.9): no CREATE EXTENSION
      # outside citext, pg_trgm and pgcrypto. The functional suite checks the
      # migrated database's pg_extension against the same list.
      - name: T-ARCH-034 extension allow-list
        run: node scripts/check_migration_extensions.mjs
      # docs/04 §2.1: the baseline's keys default to uuidv7(), built into
      # PostgreSQL 18; this records that the CI image has it.
      - name: uuidv7() on postgres:18.4
        run: psql "postgresql://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_DATABASE" -c 'SELECT uuidv7()'
      # T-ARCH-010 (docs/10 §6.2): a fresh migration regenerates
      # database/schema.ts; the committed file (Prettier-formatted, as
      # lint-staged commits it) must match it and must contain no `any`.
      # It migrates as the migrator, on the pg_migrator connection that
      # exists only under NODE_ENV=test (config/database.ts).
      - name: T-ARCH-010 database/schema.ts matches the migrations
        run: |
          NODE_ENV=test node ace migration:fresh --connection=pg_migrator
          pnpm exec prettier --write database/schema.ts
          git diff --exit-code database/schema.ts
          if grep -nE '\bany\b' database/schema.ts; then exit 1; fi
      # OD-65 (docs/11 §2.2): the development Compose file's SeaweedFS, so
      # T-MED-005 runs the S3 adapter against a real S3 API; --wait returns
      # once its health check passes.
      - name: S3 server (SeaweedFS)
        run: docker compose up -d --wait seaweedfs
      # The unit suite runs in the Static job. S3_CONTRACT_REQUIRED makes a
      # missing S3 server fail T-MED-005 instead of skipping it.
      - name: Functional and concurrency suites
        env:
          S3_CONTRACT_REQUIRED: '1'
        run: node ace test functional concurrency
      # T-ARCH-016 (docs/09 §1.4): the test run regenerated the indexes of
      # .adonisjs/ through the assembler's init hooks; `codegen:routes` writes
      # routes.d.ts and the Tuyau registry, which only the dev server's route
      # hooks write otherwise. The committed files must equal what they wrote.
      - name: T-ARCH-016 generated files are fresh
        run: |
          NODE_ENV=test node ace codegen:routes
          git diff --exit-code -- .adonisjs
          untracked=$(git status --porcelain --untracked-files=all -- .adonisjs)
          if [ -n "$untracked" ]; then echo "$untracked"; exit 1; fi

  # docs/10 §5.1 Image.
  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image (not pushed)
        env:
          APP_RELEASE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --build-arg APP_RELEASE="$APP_RELEASE" --tag dripnepal:ci .
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Chromium for the hydration check
        run: pnpm exec playwright install --with-deps chromium
      # T-OPS-010 (docs/11 §4.2): non-root, no .env*, SSR bundle present, and
      # the image boots in a staging-shaped environment. Then, with it
      # running, T-ARCH-002 (docs/03 §3.3): the 404 page is server-rendered
      # and React hydrates it in Chromium with no error.
      - name: T-OPS-010 image checks and T-ARCH-002 hydration
        run: scripts/check_image.sh dripnepal:ci node scripts/check_hydration.mjs --base http://127.0.0.1:3399

  # docs/10 §5.1 Reports: T-PERF-003, Lighthouse on the storefront pages of a
  # production build (docs/08 §10.1, docs/11 §12.3), report only. The job
  # fails when a page cannot be measured, never on a budget, and it is not a
  # required check (docs/10 §5.4); the table is in the job summary and the
  # reports are an artifact. The perf suite rebuilds the test database and
  # commits a stand-in for the launch catalogue, with its photos in SeaweedFS;
  # the build then runs with APP_ENV=development over http, because staging
  # and production need https (start/env_policy.ts). It serves its built
  # assets either way, but development turns the CSP off (config/shield.ts),
  # so a CSP violation cannot show here (T-ARCH-002 runs the image under
  # staging settings). Lighthouse uses the Chrome of the runner image.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: docker.io/postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: dripnepal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dripnepal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: App key for the run
        run: echo "APP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Database roles
        env:
          PGPASSWORD: secret
        run: |
          psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U postgres -d "$DB_DATABASE" <<'SQL'
          CREATE ROLE dripnepal_migrator LOGIN PASSWORD 'secret' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE dripnepal_app LOGIN PASSWORD 'secret' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE dripnepal_readonly LOGIN PASSWORD 'secret' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT pg_read_all_stats TO dripnepal_readonly;
          ALTER DATABASE dripnepal_test OWNER TO dripnepal_migrator;
          SQL
      - name: S3 server (SeaweedFS)
        run: docker compose up -d --wait seaweedfs
      - name: T-PERF-003 the launch catalogue
        env:
          PERF_CATALOGUE: '1'
        run: node ace test perf
      - name: Production build
        run: node ace build
      - name: Start the built app
        env:
          NODE_ENV: development
          APP_ENV: development
          DB_DEBUG: 'false'
          # SeaweedFS's development values (docker/seaweedfs/s3.json), on the test buckets:
          # public placeholders, and all of them, since a partial set fails start/env.ts.
          S3_ENDPOINT: http://localhost:8333
          S3_REGION: auto
          S3_ACCESS_KEY_ID: dripnepal-dev
          S3_SECRET_ACCESS_KEY: dripnepal-dev-secret
          S3_BUCKET_PRIVATE: dripnepal-test-private
          S3_BUCKET_PUBLIC: dripnepal-test-public
          MEDIA_PUBLIC_URL: http://localhost:8333/dripnepal-test-public
        run: |
          cp .env.test build/.env
          mkdir -p tmp
          (cd build && nohup node bin/server.js > ../tmp/server.log 2>&1 &)
          curl -sf -o /dev/null --retry 60 --retry-delay 1 --retry-connrefused http://localhost:3333/health/ready
      - name: T-PERF-003 Lighthouse (report only)
        run: node scripts/run_lighthouse.mjs --base http://localhost:3333 --out tmp/lighthouse
      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: |
            tmp/lighthouse
            tmp/server.log
          retention-days: 14
          if-no-files-found: ignore
