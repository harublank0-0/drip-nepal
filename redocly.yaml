# T-API-009: the OpenAPI 3.1 lint of docs/openapi.yaml (docs/09 §4.5), run
# by `pnpm lint:openapi` in CI's Contract stage. Errors fail: an invalid
# schema, a broken $ref, a duplicate operationId and the rest of the
# recommended set. Three recommended rules are off because the contract
# breaks them on purpose (docs/09 §4.5, note on the spec lint).
extends:
  - recommended
rules:
  # Conditional `required` in if/then lists a property its parent defines,
  # which this rule cannot follow (FulfillmentEventRequest, CreateRefundRequest).
  no-required-schema-properties-undefined: off
  # The first server is local development, http://localhost:3333.
  no-server-example.com: off
  # GET /payments/{provider}/return is an Inertia page (x-page-route), with no operationId.
  operation-operationId: off
# No usage data leaves the machine or the CI runner.
telemetry: off
