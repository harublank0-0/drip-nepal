    patch:
      operationId: updateProduct
      tags: [Seller]
      summary: Edit a product's fields
      description: |
        Actor: `shop.products.edit`; shop status gate: `active` only (07 §4.4). Scope: as
        `getShopProduct`. ⟳: `If-Match: "<version>"` is required (428 when missing; 412
        `VERSION_CONFLICT` with `current`, the editor view, when stale, 06 §8).
        Status gate (05 §6.10): a product in `pending_review`, `archived` or `blocked` is 409
        `INVALID_STATE_TRANSITION`. Partial: a member left out keeps its value; `null` clears a
        nullable one; `attributes`, when sent, replaces the attribute set, and when left out the
        stored set is kept. Only what the request sends or changes is checked, by the rules of
        `createProduct`: a new category is an active leaf, a new brand is active, a sent origin
        agrees, and the attribute set is checked when sent or when the category changes
        (T-CAT-101, T-CAT-104); a new category must also allow the product's option axes (422
        `axes_not_allowed` on `category_id`). A product in `published` or `unpublished` keeps
        every disclosure, and, when its attributes or category change, every required attribute
        (`required` on `attributes`) and every required axis of the category (`axes_required` on
        `category_id`); it may not switch to a brand with `requires_moderation` (422
        `moderation_required` on `brand_id`; T-CAT-105). All problems come in one 422.
