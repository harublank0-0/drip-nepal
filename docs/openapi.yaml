#     201 shows that variant and `missing_for_submit` with `warranty_text` (note 15).
#     `replaceProductVariants` is 409 `INVALID_STATE_TRANSITION` for a product in
#     `pending_review`, `archived` or `blocked`, and its active-variant rule covers `published`
#     and `unpublished` only. `quoteCheckout` answers 200 with a `delivery_not_available`
#     problem and never 422 `DELIVERY_NOT_AVAILABLE` (note 19). `getMyOrder` moves to R1·M5 for
#     the order-complete page. The `recordFulfillmentEvent` refusal is a `reattempt` when
#     `attempt_count` is already 3 (a 4th delivery attempt, 05 §6.3, 04a §11.5).
#     `RefundItemInput` has no `amount_minor`: the server computes each line amount (05 §3.2,
#     §7.4); `CreateRefundRequest.amount_minor` is the total with a shipping part within the
#     05 §3.3 cap, and an optional internal `note` is stored in `refunds.note` (04a §12.4).
#     `Location` is sent only when a read operation serves the new resource (06 §3.7, §7.5), so
#     the `createRefund` 201 has none. `ListingCard.brand` and `image.alt` come from the derived
#     `brand_slug` and `primary_image_alt` columns (04a §7.12), and the listing example uses
#     the content-addressed keys of 03 §3.5. `ProblemErrorItem` names `shop_frozen` (proposed)
#     and the `addCartItem` use of `insufficient_stock`; `retry_after_seconds` and the
#     `placeOrder` description follow the kill-switch rule (no `Retry-After`, 06 §5.2). The
#     `approveRefund` example is approved by a finance officer, as in 06 §14.8. No operation
#     resets a lost staff authenticator in R1 (06 §13.6, 11 §14.6), so none is pending here.
#     Checked against the 04a tables (04 "For other documents" item 9): the foundation shapes
#     use the 04a CHECK lists and bounds (`shipments_attempt_count_check`, the
#     `shipment_events` reason and note checks, the refund, payment and movement enums); the
#     one gap, `refunds.note`, is the new `note` input.
