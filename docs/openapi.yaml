  /api/v1/seller/shops/{shopSlug}/orders/{shopOrderNumber}/fulfillment-events:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
      - $ref: '#/components/parameters/ShopOrderNumber'
    post:
      operationId: recordFulfillmentEvent
      tags: [Seller]
      summary: Record a shipment event
      description: |
        Actor: `shop.orders.process` (owner, manager, `order_fulfiller`); allowed while the
        shop is `active` or `suspended` with `suspension_mode = fulfill_existing` (06 §4.4).
        Scope: `{shopOrderNumber}` inside the shop, else 404 (T-SEC-001).
        Each event is one row of the 05 §6.3 Shipment table, applied by status compare-and-set:
        `packed`, `shipped` (needs `courier_name`, free text in R1; `tracking_number` and
        `tracking_url` are optional, 01 AC-FR-FUL-001-1 and 05 §6.3; `tracking_url` https only),
        `delivered` (sets `delivered_at` and the stored `return_window_ends_at`; ledger
        delivery posting only if the payment is already collected or captured),
        `delivery_failed` (needs `failure_reason`), `reattempt` (at most 3 attempts; a 4th is
        409 `INVALID_STATE_TRANSITION`), `returning`, `returned_to_origin` (needs `items[]` with
        `restock_quantity` per line and a `note` when any unit is not restocked, 05 §5.8;
        `rto_restock` movements, shop order `cancelled` with `undeliverable`).
        Tracking correction (proposed; not yet in canon §6.5): `shipped` sent again while the
        shipment is `shipped` with a changed courier or tracking field updates only those
        fields, writes an event row and audit `shipment.update_tracking`, and emails the
        customer; identical values are a 200 no-op with no event row (05 §6.3, 06 §13.8).
        A disallowed event is 409 `INVALID_STATE_TRANSITION` with `current_status` and
        `allowed_events`. Idempotency: ⚷, 24 h. Release R1·M6.
      x-release: R1·M6
      x-permission: shop.orders.process
      x-idempotency: { required: true, retention_hours: 24 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FulfillmentEventRequest' }
            examples:
              shipped:
                summary: 06 §14.6, first shipment
                value:
                  event: shipped
                  courier_name: Nepal Can Move
                  tracking_number: NCM123456
                  tracking_url: https://example-courier.com.np/track/NCM123456
              delivered:
                summary: 06 §14.6, two days later
                value: { event: delivered }
      responses:
        '200':
          description: The shop order and its shipment after the event.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentResultResponse' }
              examples:
                shipped:
                  summary: 06 §14.6 (fields 06 abbreviates are filled in, per 06 §3.3)
                  value:
                    data:
                      shop_order: { number: DN-7K3M9QX-1, status: accepted, version: 4 }
                      shipment:
                        status: shipped
                        courier_name: Nepal Can Move
                        tracking_number: NCM123456
                        tracking_url: https://example-courier.com.np/track/NCM123456
                        attempt_count: 1
                        shipped_at: '2026-10-03T09:12:00.000Z'
                        delivered_at: null
                        return_window_ends_at: null
                      next_steps: []
                delivered:
                  summary: 06 §14.6, delivered; COD outcome still to record
                  value:
                    data:
                      shop_order: { number: DN-7K3M9QX-1, status: accepted, version: 5 }
                      shipment:
                        status: delivered
                        courier_name: Nepal Can Move
                        tracking_number: NCM123456
                        tracking_url: https://example-courier.com.np/track/NCM123456
                        attempt_count: 1
                        shipped_at: '2026-10-03T09:12:00.000Z'
                        delivered_at: '2026-10-05T11:40:00.000Z'
                        return_window_ends_at: '2026-10-12T11:40:00.000Z'
                      next_steps: [record_cod_collection]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`INVALID_STATE_TRANSITION` (including a 4th reattempt) or an idempotency conflict.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Retry-After: { $ref: '#/components/headers/Retry-After' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem409' }
              examples:
                alreadyDelivered:
                  summary: 06 §14.6, `reattempt` on a delivered shipment
                  value:
                    type: https://dripnepal.com/problems/invalid-state-transition
                    title: Invalid state transition
                    status: 409
                    code: INVALID_STATE_TRANSITION
                    detail: This parcel is already delivered.
                    request_id: 01929a90-0003-7000-8000-000000000003
                    current_status: delivered
                    allowed_events: []
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/webhooks/payments/{provider}:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: receivePaymentWebhook
      tags: [Provider returns]
      summary: Reserved inbound payment webhook (R1.1)
      description: |
        Reserved route: eSewa ePay v2 and Khalti KPG-2 web checkout document no
        server-to-server webhook (06 §12.1 [Verified-doc
        <https://developer.esewa.com.np/pages/Epay> and <https://docs.khalti.com/khalti-epayment/>,
        accessed 2026-09-25]); it is built only if a provider that notifies (for example the
        eSewa Intent callback [Verified-doc <https://developer.esewa.com.np/pages/Intent>,
        accessed 2026-09-25]) is adopted. Provider facts stay [Verify-external VX-06, VX-07]
        until the M8 sandbox confirms them.
        Contract (06 §12.4): no session, CSRF-exempt by exact route only (T-API-006), limiter
        `webhook_ip` 600/min (proposed; not yet in canon §6.6), body at most 64 KB (proposed),
        JSON only. The raw body is hashed into `provider_events.raw_body_sha256`. Where the
        provider signs, a missing or invalid signature is answered 401 `UNAUTHENTICATED` and not
        stored (only a `provider.message_rejected` log line, 07 TM-18); an unsigned provider's
        callback is stored only when its reference matches a gateway payment of that provider
        (key `webhook:<payment id>:<provider status>`, proposed; 04a §12.3). In one short
        transaction the server inserts `provider_events` (`kind = 'webhook'`,
        `processing_status = 'pending'`) `ON CONFLICT DO NOTHING` and sends
        `payments.process_provider_event`; a duplicate sends no job. No provider lookup runs
        inline: the job looks up the payment server-to-server and applies only forward
        transitions (ADR-0012). The body is never evidence of payment.
        The request body is the provider's own payload, so it is the one request schema here
        that allows unknown members. Release R1.1·M8, only if a provider notifies.
      x-release: R1.1·M8
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        description: Provider-defined JSON payload; used only to find the payment to look up.
        content:
          application/json:
            schema:
              type: object
              description: Provider payload, stored redacted in `provider_events.payload`.
              additionalProperties: true
      responses:
        '200':
          description: Durably recorded (or already recorded); processing continues in a job.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceivedResponse' }
              examples:
                received:
                  summary: 06 §12.4 step 5
                  value: { data: { received: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing or invalid provider signature (not stored, not processed; 06 §12.4).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem401' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /payments/{provider}/return:
    parameters:
      - $ref: '#/components/parameters/Provider'
    get:
      tags: [Provider returns]
      summary: Payment return page (Inertia SSR, not JSON)
      description: |
        Page route, not a `/api/v1` operation, so it has no operationId (canon §6.5 and 06 §13.7
        call it a page route) and T-API-001 does not apply; it is documented here because 06 §12.2
        defines its contract. Release R1.1·M8.
        No session needed (the customer may return on another device). `attempt` selects **our**
        payment and is never evidence of payment. Steps (06 §12.2): load the payment by
        `attempt` and match the provider reference; insert `provider_events` (`kind = 'return'`)
        `ON CONFLICT DO NOTHING`; for eSewa, verify the HMAC-SHA256 signature of the Base64
        payload in constant time (invalid → stop, page says "We could not confirm this payment
        yet"); look up the payment server-to-server with the **stored** reference and a 10 s
        timeout [Assumption]; apply the outcome with the forward-only CAS
        `orders.applyPaymentOutcome` (05 §6.4); render from the payment's current state. Redirect
        parameters such as `status`, `amount` and `total_amount` are logged as evidence and never
        used for state (T-PAY-001, proposed in 05). Duplicates and reloads give one state change
        (T-PAY-005); a new lookup happens at most once per 10 s per payment (`payment_return`
        limiter, proposed; not yet in canon §6.6). `Cache-Control: no-store`.
      x-release: R1.1·M8
      x-page-route: true
      security: []
      parameters:
        - name: attempt
          in: query
          required: true
          description: Our `payments.id`, added to the return URLs at initiate time.
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: result
          in: query
          description: eSewa only; `success` or `failure`, chosen by which of our URLs eSewa redirected to.
          schema: { type: string, enum: [success, failure] }
        - name: provider_params
          in: query
          description: |
            Parameters the provider appends. Khalti KPG-2 appends `pidx`, `status`,
            `transaction_id`, `tidx`, `amount`, `mobile`, `purchase_order_id`,
            `purchase_order_name` and `total_amount`, unsigned [Verified-doc
            <https://docs.khalti.com/khalti-epayment/>, accessed 2026-09-25]. The eSewa success
            redirect carries a signed Base64 JSON payload whose query parameter name is
            undocumented [Verify-external VX-06].
          style: form
          explode: true
          schema:
            type: object
            additionalProperties: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: |
            SSR page: confirmation when `captured`; "Confirming your payment" with a 5 s poll of
            `payment_status` for up to 2 minutes while pending [Assumption]; "Nothing was charged"
            with a retry button (`startOrderPayment`) when failed or expired.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Unknown provider or unknown attempt; rendered as the `errors/not_found` page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            text/html:
              schema: { type: string }

  /api/v1/admin/refunds:
    post:
      operationId: createRefund
      tags: [Admin]
      summary: Create a refund for one shop order
      description: |
        Actor: platform staff with `platform.refunds.create` and MFA verified within 12 h
        (06 §4.3). Scope: staff act across shops; `shop_order_number` and `return_number` only
        select the target and must exist (404 otherwise).
        Rules (05 §6.7): the refundable amount is checked with the allocation and payment rows
        locked; above it → 422 `REFUND_EXCEEDS_REFUNDABLE` with `refundable_minor`, and the
        `payments_refunded_le_captured_check` CHECK is the backstop (T-SEC-004).
        `amount_minor` = Σ `items[].amount_minor` + a shipping part of at most the shop order's
        shipping fee. `reason_code = return_accepted` requires `return_number` (and only then).
        `recipient_details` is required for `manual_transfer` and stored encrypted.
        Methods: `manual_transfer` in R1; `gateway_api` (Khalti) and `gateway_manual` (eSewa)
        from R1.1. `due_at` is the return's `refund_due_at` or `created_at` + 7 days
        (AC-FR-RET-007-1) [Assumption pending Verify-external VX-02]; a refund that names a
        `cancelled` one in `replaces_refund_id` (proposed, 05 §8.8) copies its `due_at`,
        `refund_items` and `affects_vendor_ledger`.
        A shop order or return whose state allows no refund is 409 `INVALID_STATE_TRANSITION`
        (06 §13.6). Side effects: refund `requested`, refund items, audit. Idempotency: ⚷, 24 h.
        Release R1·M7.
      x-release: R1·M7
      x-permission: platform.refunds.create
      x-idempotency: { required: true, retention_hours: 24 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
            examples:
              returnAccepted:
                summary: 06 §14.8, Khalti gateway_api refund for an accepted return (R1.1)
                value:
                  shop_order_number: DN-8P2R4TW-1
                  amount_minor: 139900
                  reason_code: return_accepted
                  method: gateway_api
                  items:
                    - {
                        order_item_id: 01929b10-0000-7000-8000-0000000000d1,
                        quantity: 1,
                        amount_minor: 139900,
                      }
                  return_number: RT-3H8K2MZ
      responses:
        '201':
          description: Refund created in `requested`; `Location` is the refund resource.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Location: { $ref: '#/components/headers/Location' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResponse' }
              examples:
                requested:
                  summary: 06 §14.8 (`succeeded_at` filled in, per 06 §3.3)
                  value:
                    data:
                      id: 01929b20-0000-7000-8000-0000000000e1
                      status: requested
                      amount: { amount_minor: 139900, currency: NPR }
                      method: gateway_api
                      due_at: '2026-10-16T08:00:00.000Z'
                      created_by: 01929000-0000-7000-8000-00000000f001
                      succeeded_at: null
                      version: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: '`REFUND_EXCEEDS_REFUNDABLE`, `VALIDATION_FAILED` or `IDEMPOTENCY_KEY_REUSED`.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                exceeds:
                  summary: 06 §14.8, more than the refundable amount (T-SEC-004)
                  value:
                    type: https://dripnepal.com/problems/refund-exceeds-refundable
                    title: Refund exceeds refundable amount
                    status: 422
                    code: REFUND_EXCEEDS_REFUNDABLE
                    detail: At most Rs 1,399.00 can still be refunded for this shop order.
                    request_id: 01929b20-0002-7000-8000-000000000002
                    refundable_minor: 139900
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/admin/refunds/{refundId}/approve:
    parameters:
      - $ref: '#/components/parameters/RefundId'
    post:
      operationId: approveRefund
      tags: [Admin]
      summary: Approve a requested refund (maker-checker)
      description: |
        Actor: platform staff with `platform.refunds.approve` and fresh MFA. The approver must
        differ from the creator (`refunds_maker_checker_check`); the same person gets 403
        `FORBIDDEN`, unless `single_operator_mode = true` [Assumption; Open OD-14], which requires
        a fresh `totp_code` in the body (wrong code → 422 on `totp_code`, rate limited by the
        `mfa` limiter, proposed; not yet in canon §6.6) and flags the refund and audit row.
        Transition `requested → approved` by status CAS (05 §6.7); any other state is 409
        `INVALID_STATE_TRANSITION`. Side effects: for `gateway_api`, job `refunds.execute` is
        sent in the same transaction; manual methods go to the operator queue. Audit
        `refund.approve`. Idempotency: ⚷, 24 h. Release R1·M7.
      x-release: R1·M7
      x-permission: platform.refunds.approve
      x-idempotency: { required: true, retention_hours: 24 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRefundRequest' }
            examples:
              secondOfficer:
                summary: 06 §14.8, a second finance officer approves
                value: {}
      responses:
        '200':
          description: Refund `approved`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResponse' }
              examples:
                approved:
                  summary: 06 §14.8 says "200 `approved`"; the body is inferred (`version` 2 after one CAS)
                  value:
                    data:
                      id: 01929b20-0000-7000-8000-0000000000e1
                      status: approved
                      amount: { amount_minor: 139900, currency: NPR }
                      method: gateway_api
                      due_at: '2026-10-16T08:00:00.000Z'
                      created_by: 01929000-0000-7000-8000-00000000f001
                      succeeded_at: null
                      version: 2
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/admin/refunds/{refundId}/resolve-review:
    parameters:
      - $ref: '#/components/parameters/RefundId'
    post:
      operationId: resolveRefundReview
      tags: [Admin]
      summary: Resolve a refund in needs_review with evidence (proposed)
      description: |
        Proposed; not yet in canon §6.5 (06 §13.8, shown in 06 §14.8); waits for the product
        owner's approval. Actor: platform staff with fresh MFA and `platform.ledger.adjust`
        today; `platform.payments.review` is proposed; not yet in canon §7 (07 decides).
        Transition `needs_review → succeeded` or `needs_review → failed` by status CAS (05 §6.7);
        an `evidence_reference` is mandatory. On `succeeded` the transaction increases
        `refunded_minor` on the payment and allocation, posts `refund` and `commission_reversal`
        ledger entries if the delivery was posted (05 §7.4), and emails the customer. Audit
        `refund.resolve_review`. Other states → 409 `INVALID_STATE_TRANSITION`.
        Idempotency: ⚷, 24 h. Release R1.1·M8.
      x-release: R1.1·M8
      x-proposed: true
      x-permission: platform.ledger.adjust
      x-idempotency: { required: true, retention_hours: 24 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
