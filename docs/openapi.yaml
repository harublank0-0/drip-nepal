  /api/v1/seller/shops/{shopSlug}/products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
      - $ref: '#/components/parameters/ProductId'
    put:
      operationId: replaceProductVariants
      tags: [Seller]
      summary: Set option axes and the whole variant set
      description: |
        Actor: `shop.products.edit`; shop status gate of 06 §4.4. Scope: `{productId}` is
        looked up inside the shop; another shop's product is 404 (T-SEC-001). A `variants[].id`
        that names no variant of this product, such as another shop's variant, is 404
        `NOT_FOUND` (T-SEC-001 case (c), as `replaceProductMedia` answers).
        Status gate: a product in `pending_review`, `archived` or `blocked` is 409
        `INVALID_STATE_TRANSITION`, as `updateProduct` answers (06 §13.5; cross-doc check
        decision, 2026-10-01). A `rejected` product moves back to `draft` in the same
        transaction (status CAS `rejected → draft`), as `updateProduct` does, so a vendor who
        fixes only the variants can resubmit it (05 §6.10, AC-FR-CAT-006-2; 06 §13.5).
        Whole-set replacement (PUT): variants carrying an `id` are updated, variants without
        one are created with an `inventory_items` row at 0, and variants left out are archived
        (or deleted if never stocked or ordered, 04a §7.9), such as the default variant
        `createProduct` made, which is deleted with its zero `inventory_items` row (06 §14.2).
        Validation (422 `VALIDATION_FAILED`): no duplicate combination, SKU unique per shop among
        active variants, `compare_at_price_minor` > `price_minor`, at most 100 variants
        (`is_default` is not an input: the server sets it true only for the single option-less
        variant, `product_variants_default_signature_check`), `price_minor` 0–100,000,000 paisa
        (04a §7.9); a product in `published` or `unpublished` keeps at least one active variant
        and every active variant priced above zero (AC-FR-CAT-004-3). The action's pre-check
        answers a duplicate SKU on `variants.N.sku` and a duplicate combination on
        `variants.N.option_value_codes`, code `unique`. `product_variants_shop_sku_key` and
        `product_variants_product_signature_key` are only the backstop for a race: their 23505
        carries no row index, so it answers field `variants`, code `unique` (06 §5.3, §14.2;
        04 §3.5, §16.5; 09 §5.4). An `id` naming an archived variant of this product
        re-activates it; at most two option axes, which may be reordered in place (04a §7.8). Removing or replacing an axis once a variant of the product
        has an inventory movement or an order line answers 409 `CONFLICT` (axis set frozen, 04a §7.8).
        Built (R1-S part 2b): an axis the category does not offer is 422 `not_allowed` on
        `option_axes.N`; a live product must keep every required axis of its category (422
        `required` on `option_axes`); a variant with history keeps its options (422 `history` on
        `variants.N.option_value_codes`) and, left out, is archived, not deleted; a set that
        changes nothing writes nothing and keeps the version; audit `product.variants_replace`
        (proposed) with the axes and the counts, and `catalog.refresh_listing`. An axis the
        product already has stays usable after its category rule is dropped. T-CAT-011,
        T-CAT-102, T-CAT-103, T-CAT-106, T-CAT-109, T-API-004, T-SEC-001, T-SEC-003.
        Concurrency: ⟳ `If-Match` on `products.version`; bumps it and each changed variant's
        `version`. Missing, `*` or a list → 428; a stale version, a weak tag (`W/"2"` even when
        2 is current, because the comparison is strong) or any other value → 412 with `current`
        (06 §8, §14.2). Not ⚷ (the version check stops a second apply, 06 §7.7). Body limit
        512 KB. Release R1·M3.
      x-release: R1·M3
      x-permission: shop.products.edit
      x-if-match: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceProductVariantsRequest' }
            examples:
              sizeAndColor:
                summary: 06 §14.2
                value:
                  option_axes: [apparel_size, color]
                  variants:
                    - option_value_codes: { apparel_size: m, color: black }
                      sku: KT-TEE-M-BLK
                      price_minor: 129900
                      compare_at_price_minor: 159900
                      weight_grams: 220
                    - option_value_codes: { apparel_size: l, color: black }
                      sku: KT-TEE-L-BLK
                      price_minor: 139900
                      compare_at_price_minor: null
                      weight_grams: 240
      responses:
        '200':
          description: The product with its new variant set and the new `ETag`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProductResponse' }
              examples:
                replaced:
                  summary: 06 §14.2 (fields 06 abbreviates are filled in, per 06 §3.3)
                  value:
                    data:
                      id: 01929a50-2c3d-7e4f-8a90-1b2c3d4e5f60
                      public_id: 7K3M9QXA
                      status: draft
                      version: 2
                      title: Organic cotton crew tee
                      description: 180 gsm, pre-shrunk.
                      category:
                        { id: 01928f00-1111-7000-8000-00000000a001, path: /clothing/tops/t-shirts/ }
                      brand: null
                      attributes:
                        - { attribute_code: audience, value_codes: [men, women] }
                        - { attribute_code: material, value_codes: [cotton] }
                      manufacturer_name: Kathmandu Threads Pvt. Ltd.
                      is_imported: false
                      country_of_origin: null
                      warranty_text: null
