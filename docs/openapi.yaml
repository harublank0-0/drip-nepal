          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyShopList' }
              examples:
                ownerAndManager:
                  summary: The owner of one shop who manages another (placeholders)
                  value:
                    data:
                      - slug: alpha-pasal
                        name: Alpha Pasal
                        status: active
                        role: manager
                      - slug: thulo-pasal
                        name: Thulo Pasal
                        status: active
                        role: owner
        '400':
          description: A query parameter; the list takes none, and one `invalid` item names it.
