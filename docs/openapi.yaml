        `reserved`; a count below `reserved` is 409 `below_reserved`, whose item carries
        `reserved_committed`, `committed_shop_orders` (proposed) and `reserved_held` as in
        `adjustInventory` (06 §5.1). Nothing is written and no key is stored on a conflict, so
        the vendor confirms again with a new key.
        Side effects: `stocktake` movement (delta may be 0), audit. Idempotency: ⚷, 24 h.
