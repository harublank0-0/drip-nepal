    post:
      operationId: adminCreateLogisticsAccount
      tags: [Admin]
      summary: Add a platform-owned courier account (proposed)
      description: |
        Proposed (06 §13.8); OD-58, re-decided 2026-11-22.
        Actor: platform staff with `platform.logistics.manage` (proposed) and fresh MFA.
        Step-up (07 §3.10): MFA verified within the last 15 minutes, else 401 `MFA_REQUIRED`
        with `verification_required` (06 §4.3).
        Rules (04a §9.9): the courier is active and has an adapter (422 `provider_inactive` on
        `provider_code`); a `sandbox` account in production is 422 `sandbox_in_production`;
        an `external_account_ref` already registered for the courier and environment is 422
        `already_registered`. The account starts `pending`, with no shop allowed on it
        (`adminAllowShopOnLogisticsAccount`).
        Side effects: a `logistics_accounts` row with `owner_type = 'platform'` and the
        credentials encrypted (never returned, logged, queued or audited, T-SEC-040); job
        `logistics.verify_account`; audit `logistics_account.create`.
        Idempotency: ⚷, 24 h; the fingerprint covers the body, credentials hashed into it.
        T-SEC-041. Release R1·M6.
      x-release: R1·M6
      x-proposed: true
