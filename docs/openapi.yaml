paths:
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      tags: [Public]
      summary: Storefront listing and search
      description: |
        Actor: anyone; a session, if present, is ignored for authorization (06 §2.2).
        Scope: only `product_listings` rows (published product, `active` shop, ready image).
        Pagination: page numbers (06 §6.1); ordering is the chosen sort key, then `product_id`
        (AC-FR-SRCH-001-2), so pages never repeat a row. A page beyond the last returns
        200 with empty `data`. `meta.total` is a capped count (at most 10,000, then
        `total_is_capped: true`) [Assumption].
        Filters and sorts are a closed allowlist (06 §6.3); anything else, or a repeated
        parameter with more than 20 values, is 400 `INVALID_QUERY_PARAMETER`. Attribute filters
        are named by the filterable attribute's code with value codes.
        Side effects: none. Rate limit `catalog_ip` 120/min per IP [Assumption]. The read is
        cancelled after 2 s and at most 4 of the web process's 8 connections run it at once; a
        read that waits more than 1 s for a slot, or that the 2 s limit cancels, gets 503
        `SERVICE_BUSY` with `Retry-After`, never 500 `INTERNAL` (all proposed, 07 TM-24; 06 §5.2,
        §5.3, §9.1) [Assumption].
        `Cache-Control: private, no-store` in R1 (06 §3.8). Release R1·M4.
      x-release: R1·M4
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: category
          in: query
          description: Category slug; matches the category and its subtree.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: nav
          in: query
          description: Navigation entry slug (for example the entry behind `/men/t-shirts`, 03 §6.1).
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: audience
          in: query
          description: Attribute filter `audience` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: apparel_size
          in: query
          description: Attribute filter `apparel_size` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: shoe_size_eu
          in: query
          description: Attribute filter `shoe_size_eu` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: waist_size_in
          in: query
          description: Attribute filter `waist_size_in` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: color
          in: query
          description: Attribute filter `color` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: brand
          in: query
          description: Brand slug (`brands_slug_check`, 3–40 characters, 04a §7.5).
          schema: { type: string, minLength: 3, maxLength: 40 }
        - name: shop
          in: query
          description: Shop slug.
          schema: { type: string, minLength: 3, maxLength: 40 }
        - name: price_min_minor
          in: query
          description: Lower bound of the variant price in paisa.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: price_max_minor
          in: query
          description: Upper bound of the variant price in paisa.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: in_stock
          in: query
          description: Only listings with at least one available variant.
          schema: { type: boolean }
        - name: q
          in: query
          description: Free-text search, 2–100 characters (GIN search on `product_listings`).
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: sort
          in: query
          description: Default `newest`; `relevance` only with `q`, and then it is the default.
          schema: { $ref: '#/components/schemas/ListingSort' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of listing cards.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingCardPage' }
              examples:
                page2:
                  summary: 06 §14.1, page 2 of men's M t-shirts by price
                  value:
                    data:
                      - public_id: 7K3M9QXA
                        slug: organic-cotton-crew-tee
                        title: Organic cotton crew tee
                        shop: { slug: kathmandu-threads, name: Kathmandu Threads }
                        brand: null
                        price_min: { amount_minor: 129900, currency: NPR }
                        price_max: { amount_minor: 139900, currency: NPR }
                        compare_at: { amount_minor: 159900, currency: NPR }
                        in_stock: true
                        image:
                          alt: Black crew tee, front
                          srcset_keys:
                            '320': p/01929a55-3b6c-7d8e-9f01-2a3b4c5d6e7f/9f2c4e1a-320.webp
                            '640': p/01929a55-3b6c-7d8e-9f01-2a3b4c5d6e7f/9f2c4e1a-640.webp
                        published_at: '2026-10-01T04:10:00.000Z'
                    meta:
                      { page: 2, per_page: 24, total: 25, total_is_capped: false, has_more: false }
        '400':
          description: Unknown, malformed or out-of-range query parameter.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
              examples:
                unknownSort:
                  summary: 06 §14.1, `sort=popular`
                  value:
                    type: https://dripnepal.com/problems/invalid-query-parameter
                    title: Invalid query parameter
                    status: 400
                    detail: sort must be one of newest, price_asc, price_desc, relevance.
                    code: INVALID_QUERY_PARAMETER
                    request_id: 01929a4e-9d02-7a41-8c33-0e5b6f7a8b90
                    errors:
                      - { field: sort, code: enum, message: Unsupported sort. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503':
          description: |
            503 `SERVICE_BUSY` (proposed together with the catalog-read cap and the 2 s read limit
            of 07 TM-24; 06 §5.2, §5.3). Two causes: the read waited more than 1 s for a slot under
            the cap, or the 2 s limit cancelled it (knex `KnexTimeoutError` or SQLSTATE 57014,
            caught inside this query only). Never 500 `INTERNAL`; a query cancelled on any other
            path stays 500. `Retry-After` is sent. This 503 is not sent until the cap and the
            limit are adopted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Retry-After: { $ref: '#/components/headers/Retry-After' }
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem503'
                  - type: object
                    properties:
                      code: { const: SERVICE_BUSY }

  /api/v1/locations/provinces:
    get:
      operationId: listProvinces
      tags: [Public]
      summary: The provinces, the first step of the address cascade
      description: |
        Actor: anyone, signed in or not; neither `auth` nor `guest` is on the route (06 §13.2).
        The cascade is Province → District → Local level (01 AC-FR-IAM-012-1, 08 §4.3
        `AddressForm`). Answer: the active provinces of 04a §9.1, ordered by code, each as its
        code and English name. The location data is VX-10 [Verify-external]: it is offered as
        choices and never described as official. The list is bounded (seven rows), so it takes
        no `cursor` or `limit` and answers `{ "data": [...] }` without `meta`.
        Query: none; any parameter is 400 `INVALID_QUERY_PARAMETER` with one `invalid` item
        naming it (06 §6.3).
        Order: the API limits middleware charges `catalog_ip` (120 per minute per client network,
        06 §9.1) on every call, signed in or not, instead of `api_user`; past it, 429 before the
        query is read. A session that fails the account check (06 §4.2) is answered 401 or 403
        and ended first, as on every route. Side effects: none. Release R1·M1.
      x-release: R1·M1
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The active provinces.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvinceList' }
              examples:
                provinces:
                  summary: The seven provinces (04a §9.1)
                  value:
                    data:
                      - { code: '1', name: Koshi }
                      - { code: '2', name: Madhesh }
                      - { code: '3', name: Bagmati }
                      - { code: '4', name: Gandaki }
                      - { code: '5', name: Lumbini }
                      - { code: '6', name: Karnali }
                      - { code: '7', name: Sudurpashchim }
        '400':
          description: '`INVALID_QUERY_PARAMETER`: any query parameter, with one `invalid` item naming it.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/locations/districts:
    get:
      operationId: listDistricts
      tags: [Public]
      summary: The districts of a province, the second step of the address cascade
      description: |
        Actor: anyone, signed in or not, as `listProvinces`.
        Query: `province` only, required, sent once, one digit from 1 to 7 (`^[1-7]$`, 04a §9.1).
        A missing, repeated or malformed `province`, or any other parameter, is 400
        `INVALID_QUERY_PARAMETER` with one `invalid` item naming the parameter (06 §6.3). A
        well-formed code whose province is not active answers 200 with an empty list.
        Answer: the active districts of an active province (04a §9.2), ordered by English name
        and then code, each as its code and English name; bounded (at most 14), so no `cursor`,
        no `limit` and no `meta`. The data is VX-10 [Verify-external].
        Order: `catalog_ip` first, as `listProvinces`; a 400 has taken its point. Side effects:
        none. Release R1·M1.
      x-release: R1·M1
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: province
          in: query
          required: true
          description: Province code (04a §9.1); one value.
          schema: { type: string, pattern: '^[1-7]$' }
      responses:
        '200':
          description: The active districts of the province; empty when it is not active.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictList' }
              examples:
                bagmati:
                  summary: '`province=3`, the first five of its thirteen districts'
                  value:
                    data:
                      - { code: '307', name: Bhaktapur }
                      - { code: '313', name: Chitawan }
                      - { code: '304', name: Dhading }
                      - { code: '301', name: Dolakha }
                      - { code: '306', name: Kathmandu }
        '400':
          description: |
            `INVALID_QUERY_PARAMETER`: `province` missing, repeated or not one digit from 1 to 7,
            or another parameter; one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
              examples:
                badProvince:
                  summary: '`province=8`'
                  value:
                    type: https://dripnepal.com/problems/invalid-query-parameter
                    title: Invalid query parameter
                    status: 400
                    detail: Send one province code, 1 to 7.
                    code: INVALID_QUERY_PARAMETER
                    request_id: 01929d03-0000-7000-8000-000000000400
                    errors:
                      - {
                          field: province,
                          code: invalid,
                          message: 'Send one province code, 1 to 7.',
                        }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/locations/local-levels:
    get:
      operationId: listLocalLevels
      tags: [Public]
      summary: The local levels of a district, the last step of the address cascade
      description: |
        Actor: anyone, signed in or not, as `listProvinces`.
        Query: `district` only, required, sent once, three digits with a province digit first
        (`^[1-7][0-9]{2}$`, 04a §9.2). A missing, repeated or malformed `district`, or any other
        parameter, is 400 `INVALID_QUERY_PARAMETER` with one `invalid` item naming the parameter
        (06 §6.3). A well-formed code whose district, or the district's province, is not active
        answers 200 with an empty list.
        Answer: the active local levels of that district (04a §9.3), ordered by English name and
        then code, each as its code, English name and `ward_count`, which the address form uses
        to bound `ward_no` (AC-FR-IAM-012-2); bounded by the district, so no `cursor`, no
        `limit` and no `meta`. The data is VX-10 [Verify-external].
        Order: `catalog_ip` first, as `listProvinces`; a 400 has taken its point. Side effects:
        none. Release R1·M1.
      x-release: R1·M1
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: district
          in: query
          required: true
          description: District code (04a §9.2); one value.
          schema: { type: string, pattern: '^[1-7][0-9]{2}$' }
      responses:
        '200':
