      summary: Record what staff learned from the courier about a booking (proposed)
      description: |
        Proposed (06 §13.8); waits for the product owner's approval.
        Actor: platform staff with `platform.orders.intervene` and MFA verified within 12 h; no
        step-up. Scope: the shop order's live shipment; an unknown shop order is 404.
        Own shop (OD-44, R1-S part 1c-ii): on a shop the staff member owns or works in, 403
        `FORBIDDEN` while `single_operator_mode` is off, and a `totp_code` under it
        (`OwnShopTotpCode`), checked after the key's insert, so a replayed key checks no code and
        a wrong code leaves the key free.
