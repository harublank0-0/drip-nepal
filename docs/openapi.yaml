  /api/v1/auth/signup:
    post:
      operationId: signUp
      tags: [Auth]
      summary: Create a customer account and send the verification email
      description: |
        Actor: anyone; no signed-in session is needed and none is created or changed (07 TM-09;
        02 J-04 step 2). The `guest` middleware is not on this route (09 §3.4 row 3). The request
        still carries the session cookie that holds Shield's CSRF secret, so a missing or stale
        `X-XSRF-TOKEN` is 403 `FORBIDDEN` (06 §4.1, T-SEC-013).
        Input: the members of `SignUpRequest` only; any other member, such as `status`,
        `email_verified_at`, `security_stamp` or a role, is 422 `unknown_field` and nothing is
        written (AC-FR-IAM-001-4, T-SEC-003). The email is trimmed and lower-cased (RF-22) and
        refused in the reserved `.invalid` top-level domain (T-IAM-112); the password is 10 to
        128 characters (07 §3.7); the name is normalised to NFC, then 1 to 100 code points
        (`users_full_name_check` counts them after NFC, 04 §2.8); `age_confirmed` must be the
        JSON value `true`; `phone`, when given, a
        Nepali mobile number accepted with or without `+977`, stored in E.164, encrypted, with
        its blind index and last four digits (AC-FR-IAM-001-5, T-IAM-103).
        Answer: the same 202 status and body whether or not the email has an account
        (AC-FR-IAM-001-2, T-SEC-012, T-IAM-104). The `signup_ip` limiter (5 per hour per client
        network, 06 §9.1) is charged on every valid request before the password is hashed; the
        password is hashed before the email is looked up, so both branches spend one hash.
        Side effects, in one transaction: for a new email, the user (`pending_verification`,
        inserted `ON CONFLICT (email) DO NOTHING`, whose arbiter is `users_email_key`, so a
        concurrent signup raises no violation), its `email_verification` token (24 h, 07 §3.8) and the
        verification email through `notifications.dispatch`, and one `user.signup` audit row
        with the consents by name and the legal-document versions the page links
        (AC-FR-IAM-001-6, AC-FR-IAM-013-4); for a known email, only the `notifications.dispatch`
        job of the "account already exists" email. Not ⚷ (06 §7.7). T-IAM-001. Release R1·M1.
      x-release: R1·M1
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
            examples:
              withPhone:
                summary: A sign-up with a mobile number and the marketing email box ticked
                value:
                  email: ram@example.com
                  password: example-new-password
                  full_name: Ram Thapa
                  phone: '+977 980-000-0000'
                  age_confirmed: true
                  marketing_email_consent: true
                  marketing_sms_consent: false
      responses:
        '202':
          description: Accepted, for a new and a registered email alike; nobody is signed in.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationEmailSentResponse' }
              examples:
                sent:
                  summary: The neutral answer of AC-FR-IAM-001-2
                  value: { data: { status: verification_email_sent } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/auth/email-verification:
    post:
      operationId: resendEmailVerification
      tags: [Auth]
      summary: Send a new verification link to the signed-in user
      description: |
        Actor: a signed-in user (`auth`) whose account is `pending_verification`; a user who is
        already `active` gets 403 `FORBIDDEN` and nothing is issued. The account-status check of
        06 §4.2 has already refused any other status. Input: an empty body; any member is 422
        `unknown_field`.
        The `verify_resend` limiter (3 per hour per user, 06 §9.1) is charged first, so the
        fourth request in an hour is 429 and queues nothing (AC-FR-IAM-002-3, AC-J04-10).
        Side effects, in one transaction with the user's row locked (04a §5.2): the earlier live
        `email_verification` token is consumed, so its link stops working, a new one is
        issued, and its email is queued through `notifications.dispatch`. Not ⚷ (06 §7.7).
        T-IAM-002, T-IAM-105. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: A new link is on its way; the earlier one no longer works.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationEmailSentResponse' }
              examples:
                sent:
                  summary: A resend
                  value: { data: { status: verification_email_sent } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/auth/email-verification/confirm:
    post:
      operationId: confirmEmail
      tags: [Auth]
      summary: Redeem a verification link
      description: |
        Actor: anyone holding the token; no session is needed and none is created or changed
        (07 TM-09). The request still needs `X-XSRF-TOKEN` (06 §4.1).
        Lookup and lock order (04a §5.2): the token's user is read by the SHA-256 of the token
        for the `email_verification` purpose only, the user's row is locked, then the token is
        redeemed in one statement. A user already `active` answers 200 with no write, so the
        same link again, a double click or a second tab, is not an error (AC-J04-06). For a
        `pending_verification` user, a live token is consumed and the user becomes `active`
        with `email_verified_at` (compare-and-set, 07 §3.12), with one `user.email_verify`
        audit row. A suspended or deactivated user's link answers 422 and stays unconsumed.
        An unknown, malformed, expired or replaced token, or one of another purpose, which
        stays unconsumed (T-SEC-012), is 422 on `token` with the item code `token_invalid`
        and no account data (AC-FR-IAM-002-4); nothing changes. A `token` that is missing or
        empty, not a string, or longer than 256 characters is refused by the validator first,
        with Vine's `required`, `string` or `max_length` on `token`. Not ⚷ (06 §7.7).
        T-IAM-002, T-IAM-105. Release R1·M1.
      x-release: R1·M1
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEmailRequest' }
            examples:
              link:
                summary: The token from the emailed `/verify-email?token=…` link (placeholder)
                value: { token: EXAMPLE-NOT-A-REAL-TOKEN }
      responses:
        '200':
          description: The account is `active`, now or already.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerifiedResponse' }
              examples:
                active:
                  summary: Verified
                  value: { data: { status: active } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: the token is unknown, malformed, expired, replaced, of another
            purpose or its account is suspended or deactivated (one `token_invalid` item, no
            account data); a missing, empty, non-string or over-256-character `token` (one
            `required`, `string` or `max_length` item); or a member is unknown
            (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                expired:
                  summary: An expired or already replaced link (AC-FR-IAM-002-4)
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: This link has expired or has already been used.
                    code: VALIDATION_FAILED
                    request_id: 01929d01-0000-7000-8000-000000000422
                    errors:
                      - field: token
                        code: token_invalid
                        message: This link has expired or has already been used.
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/auth/session:
    post:
      operationId: logIn
      tags: [Auth]
      summary: Sign in with email and password
      description: |
        Actor: a guest; the route runs the `guest` middleware, so a signed-in caller gets 409
        `CONFLICT` with detail "You are already signed in" and must log out first (07 §3.2;
        09 §3.4 row 3). The request carries the guest session's cookie, so a missing or stale
        `X-XSRF-TOKEN` is 403 `FORBIDDEN` (06 §4.1, T-SEC-013).
        Input: the members of `LogInRequest` only; any other member, such as `remember_me`, is
        422 `unknown_field` (T-API-002). The email is trimmed and lower-cased (RF-22).
        Order (07 §3.6): the `login_ip` limiter is charged before any credential work, then a
        `login_acct_ip` point before the check (06 §9.1); past either, 429 `RATE_LIMITED`, with
        no check and no audit row. The password is hashed once on both branches: verified
        against the stored hash, or, for an email with no account (an anonymised account
        counts as none), hashed and discarded, so a wrong password and an unknown email answer
        the same 401 with the same `detail` (AC-FR-IAM-003-2, T-SEC-012). The status is checked
        before anyone is signed in: `suspended` or `deactivated` with the right password is 403
        `ACCOUNT_SUSPENDED` and no session (AC-FR-IAM-003-4). Every refusal after the check
        keeps the limiter point and writes one `auth.login_failed` row (04a §15.3).
        On success, in one transaction: `last_login_at` by a compare-and-set on what the check
        read (a signed-in status, the same `security_stamp`, and the same `password_hash` when a
        hash made with older scrypt parameters is replaced, 07 §3.7), and one `auth.login` row;
        the account key is deleted. A miss, because a password reset or change, "sign out
        everywhere" or a suspension committed in between, starts no session: 403
        `ACCOUNT_SUSPENDED` if the status changed, else the generic 401. Then the
        session: the keys of an earlier sign-in are forgotten, the guard's `login()` issues a
        new session ID, the stamp and the login times are stored and the new row is tagged
        with the user ID (07 §3.1, §3.2, T-SEC-009). A staff member signs in the same way; the
        admin surface then answers 401 `MFA_REQUIRED` until `verifyMfaChallenge` (06 §4.3).
        `redirect_to` is `return_to` when the helper of 07 TM-14 keeps it (a path on this site,
        not under `/api/`, at most 2,048 characters, without its fragment), else `/`
        (T-SEC-017). For an `active` account with an unrevoked `platform_staff` row it is `/mfa`,
        with that path as its `return_to` unless it is `/`, because staff enrol or enter their
        TOTP code next (AC-FR-IAM-007-1; M1 part 5). Not ⚷ (06 §7.7).
        T-IAM-003. Release R1·M1.
      x-release: R1·M1
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogInRequest' }
            examples:
              withReturn:
                summary: A sign-in from `/login?return_to=/checkout`
                value:
                  email: ram@example.com
                  password: example-password
                  return_to: /checkout
      responses:
        '200':
          description: Signed in; the session cookie names a new, tagged session.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogInResponse' }
              examples:
                signedIn:
                  summary: A customer back to the checkout
                  value:
                    data:
                      user:
                        id: 01929d02-0000-7000-8000-000000000001
                        email: ram@example.com
                        full_name: Ram Thapa
                        status: active
                      redirect_to: /checkout
        '401':
          description: |
            `UNAUTHENTICATED`: a wrong password or an unknown email, with the same `detail`
            (AC-FR-IAM-003-2).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem401' }
              examples:
                invalid:
                  summary: The one answer of a wrong password and an unknown email
                  value:
                    type: https://dripnepal.com/problems/unauthenticated
                    title: Authentication required
                    status: 401
                    detail: Invalid email or password.
                    code: UNAUTHENTICATED
                    request_id: 01929d02-0000-7000-8000-000000000401
        '403':
          description: |
            `ACCOUNT_SUSPENDED` (a suspended or deactivated account with the right password; no
            session) or `FORBIDDEN` (a missing or stale `X-XSRF-TOKEN`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem403' }
        '409':
          description: '`CONFLICT`: the caller is already signed in ("You are already signed in").'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem409' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: logOut
      tags: [Auth]
      summary: Sign out
      description: |
        Actor: a signed-in user (`auth`); a guest gets 401. Input: none; a body member is 422
        `unknown_field`. The session is logged out, untagged, cleared and regenerated (06 §4.1,
        07 §3.11): its row is deleted, the cookie names a new, empty session, and the old
        cookie finds nothing afterwards (AC-FR-IAM-003-6, T-SEC-009). Clearing also drops
        Shield's CSRF secret, so the client visits a page (`/login`) before its next write.
        The 204 cannot clear the browser's history: the client calls `router.clearHistory()`
        before that visit, and every page rendered without a signed-in user renders with
        `clearHistory` (T-SEC-043). Side effects: none beyond the session. Not ⚷ (06 §7.7).
        Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Signed out.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/auth/mfa/challenge:
    post:
      operationId: verifyMfaChallenge
      tags: [Auth]
      summary: Verify a staff member's TOTP code
      description: |
        Actor: a signed-in user (`auth`) with an unrevoked `platform_staff` row and an `active`
        account; anyone else gets 403 `FORBIDDEN`, and staff without TOTP get 409 `CONFLICT`,
        before any limiter is charged (07 §3.9). Input: `code` and an optional `return_to`
        only; any other member is 422 `unknown_field`. `code` is six digits after trimming,
        else 422 before any limiter.
        Order (07 §3.9, 06 §9.1): the `mfa_user` (per account, whatever the session or IP) and
        `mfa` (per account and client network) limiters each take a point before the check; a
        wrong code keeps both and a right one deletes both; an attempt that fails for another
        reason (a secret that does not decrypt) gives both back. After 5 wrong codes in 5
        minutes the next attempt is refused unchecked, whether its code is right or wrong, and
        the account's TOTP checks are blocked for 15 minutes (OD-50): 429 `RATE_LIMITED` with
        `Retry-After`; the attempt that starts the block writes one `auth.mfa_locked` audit row
        (proposed) and raises the `mfa_lockout` alert (11 §9.7).
        The code (RFC 6238, 6 digits, 30-second step, one step either side) must be later
        than `mfa_last_used_step`; a wrong, older or replayed code is 422 `code_incorrect` on
        `code` with one `auth.mfa_failed` row (proposed). A right code records its step by a
        compare-and-set, so of two requests carrying one code one passes (AC-FR-IAM-007-3),
        and writes one `auth.mfa_verify` row (proposed).
        Then the session: `mfa_verified_at` as `{ user_id, at }` and `admin_seen_at` are put,
        and the session ID is rotated and re-tagged (07 §3.1, §3.2, §3.9, T-SEC-009); the
        admin surface accepts the proof for 12 hours and the step-up for 15 minutes (06
        §4.3). `redirect_to` is `return_to` when the helper of 07 TM-14 keeps it, else `/`
        (T-SEC-017). A dialog's step-up calls it without `return_to` and then retries its
        action with the same `Idempotency-Key` (08 §7.3 rule 5). Not ⚷ (06 §7.7).
        T-SEC-008, T-SEC-011. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyMfaChallengeRequest' }
            examples:
              fromAdmin:
                summary: The `/mfa` page after the admin surface sent the staff member there
                value:
                  code: '492039'
                  return_to: /admin/logistics
      responses:
        '200':
          description: Verified; the session continues under a new ID holding the MFA proof.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaChallengeResponse' }
              examples:
                verified:
                  summary: Back to the admin page
                  value: { data: { redirect_to: /admin/logistics } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`CONFLICT`: TOTP is not enrolled for this account; enrol first.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem409' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: a wrong, older or replayed code (`code_incorrect` on `code`), a
            malformed code, or an unknown member (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                wrong:
                  summary: A wrong code
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: That code didn't work. Enter the code your app shows now.
                    code: VALIDATION_FAILED
                    request_id: 01929d05-0000-7000-8000-000000000422
                    errors:
                      - field: code
                        code: code_incorrect
                        message: That code didn't work. Enter the code your app shows now.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Email a password reset link
      description: |
        Actor: anyone; no signed-in session is needed and none is created or changed (02 J-18
        step 1). The request still needs `X-XSRF-TOKEN` (06 §4.1).
        Input: `email` only; any other member is 422 `unknown_field` (T-API-002). The email is
        trimmed and lower-cased (RF-22); like `logIn`, an address in `.invalid` is not refused.
        Order: the `pwreset_ip` limiter (10 per hour per client network), then `pwreset_email`
        (3 per hour per email) take their point before anything is looked up, for a known and an
        unknown email alike, so the fourth request for one address in an hour is 429 either way
        (AC-FR-IAM-004-3, AC-J18-01, 06 §9.1).
        Answer: the same 202 status and body for an unknown email and for an account in any
        status (AC-FR-IAM-004-1, T-SEC-012). Side effects, in one transaction with the account's
        row locked: only an `active` or `pending_verification` account gets a `password_reset`
        token (60 minutes, 07 §3.8) and its email through `notifications.dispatch`; the earlier
        live reset token is consumed, so only the newest link works (AC-J18-04), and concurrent
        requests leave exactly one live token (T-IAM-105). A suspended, deactivated or
        anonymised account gets nothing. No audit row. Not ⚷ (06 §7.7). T-IAM-005. Release
        R1·M1.
      x-release: R1·M1
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetRequest' }
            examples:
              request:
                summary: A reset request from `/forgot-password`
                value: { email: ram@example.com }
      responses:
        '202':
          description: Accepted, for every address alike; nothing says whether it has an account.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetEmailSentResponse' }
              examples:
                sent:
                  summary: The neutral answer of AC-FR-IAM-004-1
                  value: { data: { status: reset_email_sent } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/auth/password-reset/confirm:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Set a new password with a reset link
      description: |
        Actor: anyone holding the token; no session is needed, none is created, and nobody is
        signed in afterwards (AC-FR-IAM-004-4). The request still needs `X-XSRF-TOKEN` (06 §4.1).
        Input: `token` and `password` only; any other member is 422 `unknown_field`.
        The token is looked up by its SHA-256 for the `password_reset` purpose, live, before the
        password is hashed; an unknown, used, replaced or expired token, or one of another
        purpose, which stays unconsumed (T-SEC-012), is 422 on `token` with `token_invalid` and
        no account data, and nothing changes (AC-J18-02). A live token then charges the
        `pwreset_token` limiter (5 per token per hour, proposed, 06 §9.1) before the hash; past
        it, 429 `RATE_LIMITED`. Lock order (04a §5.2): the user's row,
        then the token, redeemed in one statement, so of two tabs with one link exactly one
        succeeds (T-IAM-105). A suspended, deactivated or anonymised account's token answers the
        same 422.
        Side effects, in one transaction: the new password hash and a new `security_stamp`, so
        every session is refused on its next request (AC-J18-03); a `pending_verification`
        account also becomes `active` with `email_verified_at`, because the link proves the
        mailbox (02 J-18 step 3, 07 §3.12); the other live `password_reset` tokens are consumed,
        and a live `mfa_enrollment` token is kept while TOTP is not enrolled (OD-60);
        `identity.revoke_sessions` and the "password changed" email through
        `notifications.dispatch` (AC-J18-06); one `auth.password_reset` audit row. Not ⚷
        (06 §7.7). T-IAM-005. Release R1·M1.
      x-release: R1·M1
      security:
        - xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
            examples:
              reset:
                summary: The token from the emailed `/reset-password?token=…` link (placeholder)
                value: { token: EXAMPLE-NOT-A-REAL-TOKEN, password: example-new-password }
      responses:
        '200':
          description: The password is set; nobody is signed in, and every session has ended.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResponse' }
              examples:
                reset:
                  summary: Reset
                  value: { data: { status: password_reset } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: the token is unknown, used, replaced, expired, of another purpose
            or its account may not sign in (one `token_invalid` item on `token`, no account data);
            a missing, empty, non-string or over-256-character `token` (Vine's `required`,
            `string` or `max_length`); a `password` outside 10 to 128 characters; or an unknown
            member (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                expired:
                  summary: An expired, used or replaced link (AC-J18-02)
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: This link has expired or has already been used.
                    code: VALIDATION_FAILED
                    request_id: 01929d01-0000-7000-8000-000000000423
                    errors:
                      - field: token
                        code: token_invalid
                        message: This link has expired or has already been used.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The signed-in user's own account
      description: |
        Actor: a signed-in user (`auth`); a guest gets 401. Scope: the caller's own row only;
        there is no ID to change. The answer lists every member: the profile, the status, the
        two marketing consents as booleans (as `updateMe` takes them), the phone's last four
        digits, the staff role of an unrevoked `platform_staff` row (enrolled or not), and the
        shops the user owns or is an `active` member of, with their place in each (at most 20,
        the first by name, A-63). Never the
        password hash, the security stamp, the TOTP secret, the encrypted phone or its blind
        index (07 §5.5, TM-06). Side effects: none. Charged to `api_user` (300 per minute per
        user, 06 §9.1), as every authenticated call without a limiter of its own is since M1 part
        6a; past it, 429. T-IAM-004. Release R1·M1.
      x-release: R1·M1
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The caller's account.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
              examples:
                owner:
                  summary: A customer who owns one shop
                  value:
                    data:
                      id: 01929d02-0000-7000-8000-000000000001
                      email: ram@example.com
                      full_name: Ram Thapa
                      status: active
                      phone_last4: '4567'
                      marketing_email_consent: true
                      marketing_sms_consent: false
                      staff_role: null
                      shops:
                        - slug: thulo-pasal
                          name: Thulo Pasal
                          status: pending_review
                          role: owner
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      operationId: updateMe
      tags: [Me]
      summary: Edit the signed-in user's profile and marketing consents
      description: |
        Actor: a signed-in user (`auth`), `pending_verification` included (AC-FR-IAM-002-2); a
        guest gets 401. Scope: the caller's own row only. Input: `full_name`, `phone` and the two
        marketing consents, each optional; an absent member keeps its column, and an empty body
        changes nothing. Any other member, `email` included (no operation changes the login email
        in R1), is 422 `unknown_field` (T-SEC-003). `full_name` is trimmed and normalised to NFC,
        then 1 to 100 code points; `phone` is a Nepali mobile number (`^9[678]\d{8}$` once `+977`,
        `977`, a leading `0`, spaces and hyphens are dropped), stored in E.164 encrypted with its
        blind index and last four digits (04 §2.9), or `null`, which removes the number; `""`
        removes it too, because the JSON body parser turns an empty string into `null` and the
        two cannot be told apart. The consents are strict booleans. `full_name` and the consents
        may be left out but not sent as `null` or `""`: 422 `required`.
        Order: the `profile_update` limiter (20 per hour per user, proposed, 06 §9.1) takes a
        point on every call first, because each consent change adds a row to the insert-only
        `audit_logs`; past it, 429 `RATE_LIMITED` and nothing is written. It has this row of its
        own, so `api_user` does not charge it.
        Side effects, in one transaction: the user's row is locked and the write is a
        compare-and-set on a signed-in status and the acting session's stamp, so a suspension,
        deletion request, password change or "sign out everywhere" that committed after the
        account check wins (403 `ACCOUNT_SUSPENDED` if the status changed, else 401
        `UNAUTHENTICATED`), and nothing is written. A consent set to `true` takes the time only
        when none is held; `false` clears it at once (07 §5.3). A changed or removed phone also
        clears `phone_verified_at` (always null in R1). A request that grants or withdraws a
        consent writes one `user.consent_change` audit row (proposed) with the source
        `account_page` and the columns by name (AC-FR-IAM-013-4); the name and the phone write
        none. No email. Not ⟳ (`users` has no `version`, 06 §8) and not ⚷ (a repeat sets the
        same values, 06 §7.7). T-IAM-007, T-IAM-103, T-SEC-011. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
            examples:
              profile:
                summary: A name, a new number and the email consent withdrawn, from `/account`
                value:
                  full_name: Ram Thapa
                  phone: '+9779841234567'
                  marketing_email_consent: false
                  marketing_sms_consent: false
              removePhone:
                summary: Remove the number
                value: { phone: null }
      responses:
        '200':
          description: Saved; the account as `getMe` answers it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
              examples:
                saved:
                  summary: After the change above
                  value:
                    data:
                      id: 01929d02-0000-7000-8000-000000000001
                      email: ram@example.com
                      full_name: Ram Thapa
                      status: active
                      phone_last4: '4567'
                      marketing_email_consent: false
                      marketing_sms_consent: false
                      staff_role: null
                      shops: []
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: a name that is empty or longer than 100 code points after NFC, a
            phone that is not a Nepali mobile number (`nepal_mobile`), a consent that is not a
            boolean, a name or consent sent as `null` or `""` (`required`), or an unknown member
            (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                phone:
                  summary: A landline (AC-J04-04)
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields need attention.
                    code: VALIDATION_FAILED
                    request_id: 01929d01-0000-7000-8000-000000000425
                    errors:
                      - field: phone
                        code: nepal_mobile
                        message: The phone field must be a Nepali mobile number
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me/password:
    post:
      operationId: changePassword
      tags: [Me]
      summary: Change the signed-in user's password
      description: |
        Actor: a signed-in user (`auth`); a guest gets 401. Scope: the caller's own account.
        Input: `current_password` and `new_password` only; any other member is 422
        `unknown_field`. A `new_password` outside 10 to 128 characters is 422 before the limiter
        or any hash (07 §3.7).
        Order (07 §3.6): both `reauth` keys (5 wrong passwords per 15 minutes, 10 per 24 h per
        user, 06 §9.1) take their point before the current password is hashed; past either, 429
        `RATE_LIMITED` without hashing. A wrong current password keeps the points, writes one
        `auth.reauth_failed` audit row, adds a point to the caller's `login_acct_ip` key so it
        counts toward the login limit (AC-FR-IAM-005-1), and is 422 on `current_password` with
        `password_incorrect`; the 10th in 24 h also rotates `security_stamp` and sends
        `identity.revoke_sessions`. A right current password takes a point of the
        `password_change` limiter (5 per hour per user, proposed, 06 §9.1) before anything is
        written, because each change queues an email; past it, 429 `RATE_LIMITED`.
        Side effects, in one transaction: a compare-and-set writes the new hash and a new
        `security_stamp` only while the account may sign in and still holds the acting
        session's stamp and the hash the check verified; a miss is 403 `ACCOUNT_SUSPENDED` if
        the status changed, else 401 `UNAUTHENTICATED`. The live `password_reset` tokens are
        consumed (07 §3.8) and a live `mfa_enrollment` token is kept while TOTP is not enrolled
        (OD-60); `identity.revoke_sessions` is sent with `startAfter` 10 s and the "password
        changed" email is queued (AC-FR-IAM-005-4); one `auth.password_change` audit row.
        This session keeps working (AC-FR-IAM-005-2, AC-J18-05): it receives the new stamp in
        this request and a new session ID, re-tagged (`rotateSessionId`, 07 §3.1), so the job
        ends every other session and spares it. Not ⚷ (06 §7.7). T-IAM-006. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            examples:
              change:
                summary: A change from `/account/security`
                value:
                  current_password: example-old-password
                  new_password: example-new-password
      responses:
        '200':
          description: Changed; this session continues under a new session ID.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChangedResponse' }
              examples:
                changed:
                  summary: Changed
                  value: { data: { status: password_changed } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: a wrong current password (`password_incorrect` on
            `current_password`), a `new_password` outside 10 to 128 characters, a
            `current_password` over 128 characters, or an unknown member (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                wrong:
                  summary: A wrong current password (AC-FR-IAM-005-1)
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields need attention.
                    code: VALIDATION_FAILED
                    request_id: 01929d01-0000-7000-8000-000000000424
                    errors:
                      - field: current_password
                        code: password_incorrect
                        message: Your current password is not correct.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      tags: [Me]
      summary: Sign out of every other device
      description: |
        Actor: a signed-in user (`auth`); a guest gets 401. Input: an empty body; any member is
        422 `unknown_field`. The `revoke_all` limiter (5 per hour per user, proposed, 06 §9.1)
        takes a point on every call first, because each call queues an email and the session
        survives to call again; past it, 429 `RATE_LIMITED` and nothing is written. Side
        effects, in one transaction: a compare-and-set gives the
        account a new `security_stamp` only while it may sign in and still holds the acting
        session's stamp (a miss is 403 `ACCOUNT_SUSPENDED` if the status changed, else 401
        `UNAUTHENTICATED`); `identity.revoke_sessions`, carrying the user ID only, is sent with
        `startAfter` 10 s; one `auth.sessions_revoke` audit row (AC-FR-IAM-005-3). This session
        receives the new stamp in the same request and keeps its ID and tag, so the job deletes
        every other session of the user and spares this one (07 §3.3, T-IAM-109). The "sessions
        revoked" email is queued through `notifications.dispatch` (01 AC-FR-NOT-001-1), so the
        holder learns of it even when a stolen session did it. Not ⚷ (06 §7.7). Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: The other sessions end when the job runs; this one continues.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionsRevokedResponse' }
              examples:
                revoked:
                  summary: Signed out elsewhere
                  value: { data: { status: sessions_revoked } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me/mfa/totp:
    post:
      operationId: startTotpEnrollment
      tags: [Me]
      summary: Begin TOTP enrolment
      description: |
        Actor: a signed-in user (`auth`); in R1 only an `active` account with an unrevoked
        `platform_staff` row (FR-IAM-007), anyone else 403 `FORBIDDEN`. Input: `token` and
        `password` only; any other member is 422 `unknown_field`.
        Enrolment proves the mailbox as well as the password (07 §3.9). Checks that charge
        nothing come first: an account with TOTP on is 409 `CONFLICT`; `token` must be the live
        `mfa_enrollment` token issued to this account (purpose, owner, unconsumed, unexpired;
        07 §3.8), else 422 `token_invalid` on `token`, and a token of another purpose or
        account is left unconsumed. Then the current password through the `reauth` limiter
        (06 §9.1): both keys take their point before the hash; past 5 wrong passwords in 15
        minutes, 429 without hashing; a wrong password keeps the points, writes
        `auth.reauth_failed` and is 422 `password_incorrect` on `password`. A right password
        takes a point of the `totp_start` limiter (5 per hour per user, proposed, 06 §9.1);
        past it, 429 with nothing written.
        Side effects, in one transaction: a new 160-bit secret, sealed with the field
        encryption of 04 §2.9, is stored in `mfa_totp_secret_enc` by a compare-and-set on what
        the checks read (no TOTP yet, the password just verified; a miss is 409), with
        `mfa_last_used_step` cleared; the token, checked again under that row lock, is not
        consumed. Each start replaces the pending secret and writes one
        `auth.mfa_enrollment_start` audit row (proposed). The secret and its `otpauth://` URI
        are answered once. Not ⚷ (06 §7.7). T-SEC-008. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartTotpEnrollmentRequest' }
            examples:
              start:
                summary: The `/mfa` page with the emailed token
                value:
                  token: Zm9vYmFyLWV4YW1wbGUtdG9rZW4tbm90LXJlYWwtMDAw
                  password: example-password
      responses:
        '200':
          description: Started; the secret is shown once and never again.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollmentStartedResponse' }
              examples:
                started:
                  summary: A new secret for the authenticator app
                  value:
                    data:
                      otpauth_uri: otpauth://totp/DripNepal:hari%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=DripNepal&algorithm=SHA1&digits=6&period=30
                      secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `CONFLICT`: TOTP is already on, or the password changed between the check and the
            write.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem409' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: `token_invalid` on `token`, `password_incorrect` on `password`,
            a missing or over-long member, or an unknown member (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me/mfa/totp/confirm:
    post:
      operationId: confirmTotpEnrollment
      tags: [Me]
      summary: Confirm TOTP enrolment with a code
      description: |
        Actor: a signed-in user (`auth`); staff in R1, as `startTotpEnrollment` (else 403
        `FORBIDDEN`). Input: `code` and `token` only; any other member is 422 `unknown_field`.
        Checks that charge nothing come first: TOTP already on, or no enrolment started, is
        409 `CONFLICT`; `token` must be this account's live `mfa_enrollment` token (422
        `token_invalid`). Then the code, behind the `mfa_user` and `mfa` limiters as for
        `verifyMfaChallenge` (06 §9.1, OD-50): a wrong code keeps their points and is 422
        `code_incorrect` on `code` with one `auth.mfa_failed` row (proposed).
        Side effects, in one transaction under the user's row lock: the code must match the
        pending secret; the token is consumed in one statement bound to this user (07 §3.8),
        so of two confirmations one succeeds; a compare-and-set on the pending secret sets
        `mfa_enabled_at` and records the code's step in `mfa_last_used_step`, so the same code
        cannot pass the challenge (AC-FR-IAM-007-3); one `platform_staff.mfa_enable` audit row
        (proposed); the "two-step verification turned on" email (`user.mfa_enabled`, its event
        ID the token's row ID, one per enrolment window); the `staff_privilege_change` alert
        after the commit (11 §9.7). The session is left as it is: only `verifyMfaChallenge`
        writes the MFA proof (07 §3.2), so the client asks for the next code. Not ⚷ (06 §7.7).
        T-SEC-008, T-IAM-105. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmTotpEnrollmentRequest' }
            examples:
              confirm:
                summary: The first code from the authenticator app
                value:
                  code: '492039'
                  token: Zm9vYmFyLWV4YW1wbGUtdG9rZW4tbm90LXJlYWwtMDAw
      responses:
        '200':
          description: TOTP is on; the admin surface still needs a challenge with the next code.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnabledResponse' }
              examples:
                enabled:
                  summary: Enrolled
                  value: { data: { status: mfa_enabled } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`CONFLICT`: TOTP is already on, or no enrolment was started.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem409' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: `code_incorrect` on `code`, `token_invalid` on `token`, a
            malformed code, or an unknown member (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me/deletion-request:
    post:
      operationId: requestAccountDeletion
      tags: [Me]
      summary: Close the signed-in user's account and ask for its deletion
      description: |
        Actor: a signed-in user (`auth`), `pending_verification` included; a guest gets 401.
        Scope: the caller's own account. Input: `password` only (at most 128 characters, never
        trimmed, no minimum); any other member, a `reason` included, is 422 `unknown_field`: no
        free text is taken, because the request's only record is an insert-only audit row that
        outlives anonymisation (04 §19.2).
        Order (07 §3.6): both `reauth` keys (5 wrong passwords per 15 minutes, 10 per 24 h per
        user, 06 §9.1) take their point before the password is hashed; past either, 429
        `RATE_LIMITED` without hashing. A wrong password keeps the points, writes one
        `auth.reauth_failed` audit row and is 422 on `password` with `password_incorrect`; the
        10th in 24 h also rotates `security_stamp` and ends every session.
        Side effects, in one transaction (04 §19.2 step 1, 07 §3.12): for a requester who holds
        an unrevoked `platform_admin` row, every unrevoked `platform_admin` row is locked first
        and the other admins whose account is `active` are counted; the last one gets 409
        `CONFLICT` and nothing changes (04a §5.4). Then a compare-and-set on the status read
        under the row lock (`active` or `pending_verification`), the acting session's stamp and
        the hash the check verified sets `status = deactivated`, `deletion_requested_at` and a
        new `security_stamp`; a miss is 403 `ACCOUNT_SUSPENDED` if the status changed, else 401
        `UNAUTHENTICATED`. `identity.revoke_sessions` is sent at once, so every other session
        ends; the "deletion request received" email is queued (01 AC-FR-NOT-001-1); one
        `user.deletion_request` audit row (proposed) holds the transition and no free text
        (04a §15.3). This session ends in the
        same request, as at `logOut`; the new guest session carries the `notice` flash that
        `/login` shows (08 §2.3). The request then waits in the admin deletion queue; staff
        anonymise the account with `anonymizeUser` (M7) or reinstate it. No limiter of its own:
        the request succeeds once per deactivation and the session it came from ends with it.
        Not ⚷ (a status compare-and-set: a repeat changes nothing, 06 §7.7). T-IAM-008,
        T-IAM-110. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestAccountDeletionRequest' }
            examples:
              request:
                summary: A request from `/account/security`
                value:
                  password: example-current-password
      responses:
        '202':
          description: The account is closed and this session has ended; the request waits for staff.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequestedResponse' }
              examples:
                requested:
                  summary: Closed
                  value: { data: { status: deletion_requested } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`CONFLICT`: the caller is the last `platform_admin` whose account is `active`.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem409' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: a wrong password (`password_incorrect` on `password`), a missing or
            over-long password, or an unknown member, a `reason` included (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me/addresses:
    get:
      operationId: listAddresses
      tags: [Me]
      summary: The signed-in user's address book
      description: |
        Actor: a signed-in user (`auth`), `pending_verification` included (07 §4.4, `/account`
        self-service); a guest gets 401. Scope: `user_addresses.user_id = auth.user.id AND
        archived_at IS NULL` is part of the query (06 §4.5, 07 §4.6). Query: none; any
        parameter is 400 `INVALID_QUERY_PARAMETER` (06 §6.3). Answer: the active addresses, the default first, then the oldest first (the order of
        `user_addresses_user_active_idx`, 04a §5.5), as `Address`: the phone as its last four
        digits only (AC-FR-IAM-012-5), and the English names of the saved province, district and
        local level from the reference data, active or not (04a §9), the saved code standing in
        for a name the data does not have. The recipient name, area and landmark are decrypted by
        the customer address transformer of the 07 §5.5 allowlist (T-SEC-034). A user keeps at
        most 10 active addresses (AC-FR-IAM-012-4), so the list is bounded (06 §6.2 "Bounded
        lists"): it takes no `cursor` or `limit` and answers `{ "data": [...] }` without `meta`.
        Side effects: none. Charged to `api_user` (300 per minute per user, 06 §9.1); past it,
        429. T-SEC-006. Release R1·M1.
      x-release: R1·M1
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The caller's active addresses; an empty list when there are none.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressList' }
              examples:
                one:
                  summary: One address, the default (placeholders)
                  value:
                    data:
                      - id: 01929d04-0000-7000-8000-0000000000a1
                        label: Home
                        recipient_name: Example Recipient
                        recipient_phone_last4: '0001'
                        province_code: '3'
                        province_name: Bagmati
                        district_code: '306'
                        district_name: Kathmandu
                        local_level_code: '30608'
                        local_level_name: Kathmandu Metropolitan City
                        ward_no: 4
                        area_tole: Example Tole
                        street_landmark: null
                        postal_code: '3060804'
                        is_default: true
        '400':
          description: A query parameter; the list takes none, and one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createAddress
      tags: [Me]
      summary: Add an address to the signed-in user's address book
      description: |
        Actor: a signed-in user (`auth`), `pending_verification` included; a guest gets 401.
        Query: none; any parameter is 400 `INVALID_QUERY_PARAMETER` (06 §6.3), because the
        validator reads the body and the query merged.
        Scope: the address is the caller's; no user ID is taken.
        Input: the members of `CreateAddressRequest` only; any other member, `user_id`,
        `postal_code` or `archived_at` included, is 422 `unknown_field` and nothing is written
        (T-SEC-003). `is_default: null` is 422 `required`. The schema gives each member's rule.
        Order: unknown members, the `is_default` null check and the validator, then one
        transaction: the user's row is
        locked `FOR NO KEY UPDATE` (04a §5.5, level 0 of 05 §4.4) and the status and stamp read
        under the lock are compared with what the account check compared (07 §3.3), so a
        suspension, deletion request or stamp rotation that committed after the check wins (403
        `ACCOUNT_SUSPENDED` if the status changed, else 401 `UNAUTHENTICATED`) and nothing is
        written; then the place: the province, district and local level must be one active
        chain (422 `location_mismatch` on `local_level_code`) and the ward within the local
        level's `ward_count` (422 `ward_out_of_range` on `ward_no`), before the insert, so the
        location foreign keys are only a backstop (AC-FR-IAM-012-1, -2; T-IAM-108); then the
        cap: a user who already has 10 active addresses [Assumption, AC-FR-IAM-012-4] gets 422
        `VALIDATION_FAILED` with one item whose `field` is `null` and whose code is
        `address_limit`, exact under concurrency because of the lock (T-IAM-107).
        Side effects: the `user_addresses` row, with the recipient name, phone, area and landmark
        encrypted (AAD `user_addresses.<column>`, 04 §2.9) and the phone's last four digits
        (AC-FR-IAM-012-5). The user's first active address is the default whatever `is_default`
        says; on a later one, `is_default: true` clears the old default, then inserts the new
        one as the default (INV-17, 04 §16.3). No audit row (04a §15.3 lists no address action)
        and no email. Not ⚷ (06 §7.7 does not list it): a repeat adds a second address, which
        the user can remove. Charged to `api_user` (06 §9.1).
        Answer: 201 with the new address and no `Location`, because no read operation serves one
        address (06 §3.7). T-IAM-107, T-IAM-108, T-SEC-003. Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAddressRequest' }
            examples:
              home:
                summary: A first address from `/account/addresses` (placeholders)
                value:
                  label: Home
                  recipient_name: Example Recipient
                  recipient_phone: '+977 980-000-0001'
                  province_code: '3'
                  district_code: '306'
                  local_level_code: '30608'
                  ward_no: 4
                  area_tole: Example Tole
                  street_landmark: null
      responses:
        '201':
          description: The new address; no `Location` (06 §3.7).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }
              examples:
                created:
                  summary: The first address becomes the default
                  value:
                    data:
                      id: 01929d04-0000-7000-8000-0000000000a1
                      label: Home
                      recipient_name: Example Recipient
                      recipient_phone_last4: '0001'
                      province_code: '3'
                      province_name: Bagmati
                      district_code: '306'
                      district_name: Kathmandu
                      local_level_code: '30608'
                      local_level_name: Kathmandu Metropolitan City
                      ward_no: 4
                      area_tole: Example Tole
                      street_landmark: null
                      postal_code: '3060804'
                      is_default: true
        '400':
          description: A query parameter; the operation takes none, and one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: an unknown member (`unknown_field`); a missing required member or
            `is_default: null` (`required`); a text member outside its bounds after trimming and
            NFC (`min_length`, `max_length`); a phone that is not a Nepali mobile number
            (`nepal_mobile`); a code not of its shape (`regex`); a `ward_no` that is not an integer
            from 1 to 40, or an `is_default` that is not a boolean (Vine's type and range rules);
            a province, district and local level that are not one active chain
            (`location_mismatch` on `local_level_code`); a ward beyond the local level's
            `ward_count` (`ward_out_of_range` on `ward_no`); or 10 active addresses already
            (`address_limit`, `field` `null`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                limit:
                  summary: An eleventh address (AC-FR-IAM-012-4)
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields need attention.
                    code: VALIDATION_FAILED
                    request_id: 01929d04-0000-7000-8000-000000000422
                    errors:
                      - field: null
                        code: address_limit
                        message: You can keep up to 10 addresses. Remove one to add another.
                mismatch:
                  summary: A local level of another district (T-IAM-108)
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields need attention.
                    code: VALIDATION_FAILED
                    request_id: 01929d04-0000-7000-8000-000000000423
                    errors:
                      - field: local_level_code
                        code: location_mismatch
                        message: The province, district and local level do not match.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/me/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/CustomerAddressId'
    patch:
      operationId: updateAddress
      tags: [Me]
      summary: Edit one of the signed-in user's addresses or make it the default
      description: |
        Actor: a signed-in user (`auth`), `pending_verification` included; a guest gets 401,
        except with an `{addressId}` that is not a UUID, which matches no route and is 404 first.
        Query: none; any parameter is 400 `INVALID_QUERY_PARAMETER` (06 §6.3), because the
        validator reads the body and the query merged.
        Scope: `{addressId}` is looked up with the caller's ID and `archived_at IS NULL` in the
        query, so another user's, an archived or a missing address is 404 with the same body, and
        so is a value that is not a UUID (T-SEC-006, 07 §4.6).
        Input: the members of `UpdateAddressRequest`, each optional; an absent member keeps its
        column and an empty body changes nothing. `label: null` and `street_landmark: null`
        clear those two (`""` too, which the JSON body parser turns into `null`); the other members may be left out but not sent as `null` or `""` (422
        `required`). Any other member is 422 `unknown_field` (T-SEC-003).
        Order: unknown members, the null check and the validator, then one transaction: the
        user's row locked and the account compared as in `createAddress`; the address loaded (404
        otherwise); `is_default: false` on the current default is 422 `default_required` on
        `is_default`, because the default moves only when another address is made the default
        (04a §5.5); then the place: the place members sent are laid over the saved ones and the
        result is checked as one chain with its ward (`location_mismatch`, `ward_out_of_range`),
        so a ward alone is checked against the saved local level and a district without its
        local level is `location_mismatch`; without a place member the saved place is kept, even
        a unit made inactive since (04a §9: saved addresses stay valid).
        Side effects: the members sent, encrypted as in `createAddress`; `is_default: true` on
        another address clears the old default, then sets this one (INV-17, 04 §16.3);
        `is_default: false` on an address that is not the default changes nothing. Past orders
        keep their snapshot (04a §5.5). No audit row and no email. Not ⟳: `user_addresses` has
        no `version` (04 §2.10, 06 §8); not ⚷ (06 §7.7 does not list it): a repeat sets the same
        values. Charged to `api_user` (06 §9.1). T-IAM-107, T-IAM-108, T-SEC-003, T-SEC-006.
        Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAddressRequest' }
            examples:
              makeDefault:
                summary: Make this address the default
                value: { is_default: true }
              ward:
                summary: Another ward of the saved local level, and no landmark
                value: { ward_no: 10, street_landmark: null }
      responses:
        '200':
          description: The address after the change.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }
              examples:
                ward:
                  summary: After the ward change above
                  value:
                    data:
                      id: 01929d04-0000-7000-8000-0000000000a1
                      label: Home
                      recipient_name: Example Recipient
                      recipient_phone_last4: '0001'
                      province_code: '3'
                      province_name: Bagmati
                      district_code: '306'
                      district_name: Kathmandu
                      local_level_code: '30608'
                      local_level_name: Kathmandu Metropolitan City
                      ward_no: 10
                      area_tole: Example Tole
                      street_landmark: null
                      postal_code: '3060810'
                      is_default: true
        '400':
          description: A query parameter; the operation takes none, and one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: the items of `createAddress` except `address_limit`, with
            `required` for a member that may not be empty sent as `null` or `""`; and
            `default_required` on `is_default` for `false` on the current default.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                defaultRequired:
                  summary: '`is_default: false` on the current default'
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields need attention.
                    code: VALIDATION_FAILED
                    request_id: 01929d04-0000-7000-8000-000000000424
                    errors:
                      - field: is_default
                        code: default_required
                        message: Make another address the default instead.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: deleteAddress
      tags: [Me]
      summary: Remove one of the signed-in user's addresses (archive it)
      description: |
        Actor: a signed-in user (`auth`), `pending_verification` included; a guest gets 401,
        except with an `{addressId}` that is not a UUID, which matches no route and is 404 first.
        Query: none; any parameter is 400 `INVALID_QUERY_PARAMETER` (06 §6.3), because the
        validator reads the body and the query merged.
        Scope: as `updateAddress`; another user's, an archived, a missing or a non-UUID address
        is 404 with the same body (T-SEC-006). Input: no body members; any member is 422
        `unknown_field`.
        Side effects, in one transaction: the user's row locked and the account compared as in
        `createAddress`; the address loaded (404 otherwise); `archived_at` set, with `is_default`
        cleared in the same update (`user_addresses_default_not_archived_check`); archiving the
        default makes the most recently created remaining active address the default, so a user
        with an address always has exactly one default (AC-FR-IAM-012-4, INV-17, T-IAM-107). The
        row leaves every list and checkout; the daily `platform.retention_purge` job (proposed,
        not built yet) is to hard-delete it after 30 days [Assumption] (04a §5.5, 04 §19.3). Past
        orders keep their snapshot. No audit row and no email.
        Not ⚷: a repeat finds nothing and answers 404. Charged to `api_user` (06 §9.1).
        Release R1·M1.
      x-release: R1·M1
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Archived.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
        '400':
          description: A query parameter; the operation takes none, and one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/seller/shops:
    get:
      operationId: listMyShops
      tags: [Seller]
      summary: The shops the signed-in user owns or works in
      description: |
        Actor: a signed-in user (`auth`; the `session` requirement of 07 §4.5); a guest gets 401.
        The one seller route outside `{shopSlug}`, so no `seller_context`. Scope: the shops whose
        `owner_user_id` is the caller, in every status, and those where the caller has an
