  /api/v1/checkout/quote:
    post:
      operationId: quoteCheckout
      tags: [Cart & Checkout]
      summary: Price the active cart for review
      description: |
        Actor: customer with a verified email (`pending_verification` → 403
        `EMAIL_NOT_VERIFIED`). Scope: the caller's own active cart and own, non-archived
        address; another customer's or an archived `address_id` is 404 (T-SEC-006; 06 §4.5,
        07 §4.6).
        Read-only: takes no locks and writes nothing (05 §4.1). Returns per-shop lines,
        shipping fee, shop totals, `grand_total`, `cart_version` and `problems[]`, the line or
        shop problems (05 §4.1); the review screen shows it and `placeOrder` echoes
        `cart_version` and the grand total back. A shop that does not deliver to the address
        district is a `problems[]` item with code `delivery_not_available` naming that shop, and
        the shops that deliver are still priced (06 §13.4; cross-doc check decision,
        2026-10-01; 02 AC-J05-08). `quoteCheckout` never answers 422 `DELIVERY_NOT_AVAILABLE`,
        which only `placeOrder` returns (06 §5.2).
        Kill switch: with `checkout_enabled = false` the answer is 503 `PROVIDER_UNAVAILABLE`
        whose `detail` is the `maintenance_banner` text and no `Retry-After` (06 §5.2; the
        dedicated `CHECKOUT_DISABLED` is proposed).
        POST because it carries an address and a method, but not ⚷ (no effect to protect).
