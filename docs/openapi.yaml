  /api/v1/seller/shops/{shopSlug}/orders/{shopOrderNumber}/courier-booking:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
      - $ref: '#/components/parameters/ShopOrderNumber'
    post:
      operationId: bookCourierShipment
      tags: [Seller]
      summary: Book the parcel with a courier (proposed)
      description: |
        Proposed (06 §13.8; OD-56, OD-57); waits for the product owner's approval.
        Actor: `shop.orders.process`; allowed while the shop is `active` or `suspended` with
        `suspension_mode = fulfill_existing` (07 §4.4). Scope: `{shopOrderNumber}` inside the
        shop and released to the vendor, else 404; the account, pickup address and branches are
        checked below.
        Rules (05 §6.3), each 409 `INVALID_STATE_TRANSITION` unless marked 422: the parent
        order's verification allows dispatch (the OD-57 dispatch rule, T-ORD-011); the shop
        order is `accepted`; its live shipment is `pending` or `packed` (`pending|packed →
        booking_requested`); the shop's `fulfillment_mode` is `vendor` or `platform` (`manual`
        refuses it) and courier booking is
        enabled for the shop (`is_enabled`); the account has an active row for the shop, is
        `active`, is of the owner type the mode names, and its courier is active (422
        `account_not_usable` on `account_id`); a platform-owned account for a shop with an active
        account of its own is 422 `own_account_active`; a COD shipment on a platform-owned account
        while `platform_account_cod_enabled` (proposed) is false is 409 (OD-58, 2026-11-22); a
        sandbox account in production is 422
        `sandbox_account`; `service_code` is one of the courier's services (422
        `unknown_service`); `pickup_address_id` is a live pickup address of the shop (422
        `address_not_usable`); for a courier that books by branch both branch IDs are required
        (422 `required`) and each must be an active branch of the account's courier (422
        `branch_not_usable`, T-SHOP-114), and for any other courier a branch ID is 422
        `not_allowed`; the COD payment is `awaiting_collection`; at least one unit is left to
        ship.
        Side effects, in one transaction with the order, shop order and shipment rows locked
        (05 §4.4): `shipment_items` for the units kept; the shipment's compare-and-set to
        `booking_requested` with the account, the pickup address, `merchant_reference`
        `DN-XXXXXXX-n-Sm`, the service, the branches, `courier_name` (the courier's name) and
        the COD amount; a `booking_requested` shipment event; audit `shipment.book_request`; job
        `orders.book_courier_shipment`, which calls the courier. Whether the origin is one of
        the account's assigned branches is the courier's check: a refusal is `booking_failed`
        (`invalid_branch`). Idempotency: ⚷, 24 h. Release R1·M6.
      x-release: R1·M6
      x-proposed: true
      x-permission: shop.orders.process
      x-idempotency: { required: true, retention_hours: 24 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookCourierShipmentRequest' }
            examples:
              ncm:
                summary: Book with NCM from an assigned branch (IDs are placeholders)
                value:
                  account_id: 01929c10-0000-7000-8000-0000000000a1
                  pickup_address_id: 01929c11-0000-7000-8000-0000000000b1
                  service_code: Door2Door
                  origin_branch_id: 01929c13-0000-7000-8000-0000000000d1
                  destination_branch_id: 01929c13-0000-7000-8000-0000000000d2
      responses:
        '200':
          description: |
            The shipment in `booking_requested`; the job books it. A replay of the same key and
            body returns this 200 again with `Idempotency-Replayed: true` (06 §7.4).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourierShipmentResponse' }
              examples:
                requested:
                  summary: Waiting for the booking job (COD amount and IDs illustrative)
                  value:
                    data:
                      id: 01929c12-0000-7000-8000-0000000000c1
                      shop_order_number: DN-7K3M9QX-1
                      status: booking_requested
                      logistics_account_id: 01929c10-0000-7000-8000-0000000000a1
                      pickup_address_id: 01929c11-0000-7000-8000-0000000000b1
                      merchant_reference: DN-7K3M9QX-1-S1
                      courier_reference: DN7K3M9QX1S1
                      external_shipment_id: null
                      service_code: Door2Door
                      origin_branch_id: 01929c13-0000-7000-8000-0000000000d1
                      destination_branch_id: 01929c13-0000-7000-8000-0000000000d2
                      cancel_requested_at: null
                      cancel_requested_by: null
                      cod_amount: { amount_minor: 139900, currency: NPR }
                      courier_name: Nepal Can Move
                      tracking_number: null
                      tracking_url: null
                      booked_at: null
                      shipped_at: null
                      delivered_at: null
                      cancelled_at: null
                      return_window_ends_at: null
                      attempt_count: 0
                      version: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
