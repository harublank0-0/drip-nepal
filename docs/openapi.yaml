  /api/v1/seller/shops/{shopSlug}/orders/{shopOrderNumber}/courier-booking/cancel:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
      - $ref: '#/components/parameters/ShopOrderNumber'
    post:
      operationId: cancelCourierBooking
      tags: [Seller]
      summary: Cancel a courier booking before pickup (proposed)
      description: |
        Proposed (06 §13.8); waits for the product owner's approval.
        Actor: `shop.orders.process`; gate as `bookCourierShipment`. Scope: `{shopOrderNumber}`
        inside the shop and released to the vendor, else 404.
        Rules (05 §6.3), each refusal 409 `INVALID_STATE_TRANSITION`: the live shipment must
        have a courier booking (`current_status` is the shipment's status, or `none`).
        `booking_failed` → `cancelled`, and a new `pending` shipment is created so the vendor
        can book again; the response is that new shipment. `booked` with a courier without the
        `cancellation` capability (every R1 courier): `cancel_requested_at` and
        `cancel_requested_by = 'vendor'` are set and the `courier.cancellation_requested` alert
        is raised, so staff cancel with the courier and record it with
        `adminResolveCourierBooking`; a second request is 409, and a courier with
        `cancellation` is 409 until its cancellation job exists. `booking_requested` and
        `needs_reconciliation` (the outcome is not known yet) and every later state are 409.
        Side effects, in one transaction with the order, shop order and shipment rows locked:
        the changes above, a shipment event for each status change, and audit `shipment.cancel`
        or `shipment.cancel_request` with `reason`. Idempotency: ⚷, 24 h. Release R1·M6.
      x-release: R1·M6
      x-proposed: true
      x-permission: shop.orders.process
      x-idempotency: { required: true, retention_hours: 24 }
