    post:
      operationId: stocktakeInventory
      tags: [Seller]
      summary: Record a counted stock level
      description: |
        Actor: `shop.inventory.adjust`; shop status gate of 06 §4.4. Scope as `adjustInventory`.
        The client sends the count and the `on_hand` it displayed; the server sets `on_hand` to
        the count only if `on_hand` still equals `expected_on_hand` (05 §5.9). Otherwise 409
        `CONFLICT` with `errors[0].code = "stock_changed"` and the current `on_hand` and
        `reserved`; a count below `reserved` is 409 `below_reserved`, whose item carries
        `reserved_committed`, `committed_shop_orders` (proposed) and `reserved_held` as in
        `adjustInventory` (06 §5.1). Nothing is written and no key is stored on a conflict, so
        the vendor confirms again with a new key.
        A stale `expected_on_hand`, higher or lower, is `stock_changed` whatever the count; only
        then is a count below `reserved` `below_reserved` on `counted_quantity`.
        Side effects: `stocktake` movement (delta may be 0) referencing the key row, one
        `inventory.stocktake` audit row, and `catalog.refresh_listing` when `on_hand` changed.
        Idempotency: ⚷, 24 h. Stocktake uses `expected_on_hand` instead of `If-Match` (06 §8).
