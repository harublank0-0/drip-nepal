                      on_hand: 31
                      reserved: 1
                      available: 30
                      version: 11
                      movement:
                        id: 01929a62-0000-7000-8000-0000000000f1
                        kind: stocktake
                        on_hand_delta: 0
                        reserved_delta: 0
                        reason_code: stocktake
                        created_at: '2026-10-02T05:41:07.310Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
