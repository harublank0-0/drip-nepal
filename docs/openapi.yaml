        (proposed) naming the changed fields, and `catalog.refresh_listing`. A request that
        changes nothing writes nothing and keeps the version. Returns 200 with the editor view
        and the new `ETag`. Body limit 512 KB (06 §9.2). T-CAT-009, T-API-004. Release R1·M3
