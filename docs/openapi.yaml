        Proposed (06 §13.8, shown in 06 §14.8); waits for the product owner's approval.
        Actor: platform staff with fresh MFA and `platform.ledger.adjust` today;
        `platform.payments.review` is proposed (07 §4.2, §4.5). Step-up (07 §3.10): MFA
        verified within the last 15 minutes, else 401 `MFA_REQUIRED` with
        `verification_required` (06 §4.3).
        Transition `needs_review → succeeded` or `needs_review → failed` by status CAS (05 §6.7);
        an `evidence_reference` is mandatory. On `succeeded` the transaction increases
        `refunded_minor` on the payment and allocation, posts `refund` and `commission_reversal`
        ledger entries only if the refund has `affects_vendor_ledger` (fixed at creation, 05
        §7.4), using the amounts stored on `refund_items`, and emails the customer. Audit
