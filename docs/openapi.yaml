      description: |
        Proposed (06 §13.8); waits for the product owner's approval.
        Actor: platform staff with `platform.logistics.manage` (proposed) and fresh MFA.
        Step-up (07 §3.10): MFA verified within the last 15 minutes, else 401 `MFA_REQUIRED`
        with `verification_required` (06 §4.3), unless the body carries `totp_code`. Scope: any
        account; an unknown one is 404.
        Own shop (OD-44, R1-S part 1c-ii): a shop-owned account of a shop the staff member owns
        or works in answers 403 `FORBIDDEN` while `single_operator_mode` is off, and needs
        `totp_code` under it (`OwnShopTotpCode`); a platform-owned account is nobody's shop.
        Transitions (04a §9.9), in one transaction with the account row locked (suspend and
