        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      operationId: updateShopProfile
      tags: [Seller]
      summary: Edit the shop's profile, business details and grievance contact
      description: |
        Actor: `shop.profile.manage` (07 §4.5). The business details of 01 AC-FR-SHOP-013-2
        (`business_type`, `registration_number`, `registration_authority`, `pan_vat_number`,
        `is_vat_registered`, `return_policy_text`) and the grievance contact
        (`grievance_contact_name`, `grievance_contact_phone`) are owner-only writes, because only
        the owner sees them (AC-FR-SHOP-013-4; decided 2026-11-23, 06 note 64): a member who is
        not the owner gets 403 `FORBIDDEN` for any of them. Status gate, the "profile, shipping"
        column of 07 §4.4: open while `active`, to the owner only while `pending_review` or
        `rejected`, refused while `suspended` or `closed` (403 `SHOP_NOT_ACTIVE` with
        `shop_status` and `suspension_mode`). Scope: the shop comes from `{shopSlug}` only;
        another shop's slug answers the 404 of an unknown one (T-SEC-001). Query: none; any
        parameter is 400 `INVALID_QUERY_PARAMETER` (06 §6.3).
        Input: each member optional; an absent member keeps its column. `description`,
        `registration_number`, `registration_authority` and `pan_vat_number` may be `null`
        (or `""`, which the JSON body parser reads as `null`, or a value of spaces), which
        clears them; any other member sent as `null` is 422 `required`. Any member not listed (`name`, `slug`,
        `status`, `commission_rate_bp`, `version`, an encrypted column, the logo and banner
        media IDs until FR-MED-003, the addresses and the categories) is 422 `unknown_field`
        (T-SEC-003). Rules (04a §6.1, as `platform:create-shop`): the two numbers a Nepali
        mobile or landline, stored in E.164 (AC-FR-SHOP-001-3); the contact email by the
        account email rule, lower-cased; lengths in code points after NFC; the PAN/VAT number
        9 digits (VX-05). On the result, the saved values with the changes laid over them, a
        `registered_business` needs its registration number, registering authority and
        PAN/VAT number, and a VAT-registered shop its PAN/VAT number: else 422 `required` on
        the missing member. An individual's PAN/VAT number is neither required nor refused
        while OD-16 and VX-05 are open.
        Order: first the `shop_profile_update` limiter (20 per hour per user, proposed, 06 §9.1),
        charged on every call by a signed-in user before any check, so a refused call takes a
        point too and `api_user` does not charge it; then the permission, the status gate, the
        members, the validator and `If-Match`.
        Concurrency: ⟳ `If-Match` on `shops.version`, from `getSellerShop`'s `ETag`. Missing,
        `*` or a list → 428; a stale version, a weak tag or any other value → 412
        `VERSION_CONFLICT` with `current`, the shop as `getSellerShop` shows it to the caller
        (06 §8). Not ⚷ (06 §7.7).
        Side effects, in one transaction: the shop row locked `FOR NO KEY UPDATE` (05 §4.4
        level 0) and the status gate checked again on it; the changed columns written with
        `version + 1` by compare-and-set on the version and status; the grievance phone
        encrypted (04 §2.9), with no blind index; one `shop.profile_update` audit row
        (proposed) naming the changed columns, with the values of `business_type` and
        `is_vat_registered` only (04a §15.3). A request that changes nothing writes nothing and
        keeps the version. No listing refresh: the name is not a member. T-SHOP-009,
        T-API-004, T-SEC-030, T-SEC-031. Release R1·M2; built in R1-S part 1b.
      x-release: R1·M2
      x-permission: shop.profile.manage
      x-if-match: true
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateShopProfileRequest' }
            examples:
              publicProfile:
                summary: A manager's edit of the public profile (placeholders)
                value:
                  description: Handmade dhaka and pashmina from Palpa.
                  contact_phone: '01-4123456'
              registeredBusiness:
                summary: The owner registers the business and for VAT (placeholders)
                value:
                  business_type: registered_business
                  registration_number: '12345/079/080'
                  registration_authority: Office of the Company Registrar
                  pan_vat_number: '600123456'
                  is_vat_registered: true
      responses:
        '200':
          description: Saved; the shop as `getSellerShop` shows it to the caller, with the new `ETag`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerShopResponse' }
              examples:
                manager:
                  summary: After the manager's edit above
                  value:
                    data:
                      slug: thulo-pasal
                      name: Thulo Pasal
                      status: active
                      suspension_mode: null
                      description: Handmade dhaka and pashmina from Palpa.
                      contact_email: hello@example.com
                      contact_phone: '+97714123456'
                      business_details: null
                      grievance_contact: null
                      agreement:
                        version: '2026-11-23'
                        is_final: false
                        accepted: true
                      version: 2
        '400':
          description: A query parameter; the operation takes none, and one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: a member out of rule (`email`, `nepal_phone`, `min_length`,
            `max_length`, `regex`, `enum`, `boolean`), a `null` where none is allowed or an
            identifier a registered or VAT-registered business needs (`required`), or an
            unknown member (`unknown_field`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                registeredWithoutIdentifiers:
                  summary: An individual's shop switched to a registered business without its identifiers
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields need attention.
                    code: VALIDATION_FAILED
                    request_id: 01929d01-0000-7000-8000-000000000426
                    errors:
                      - field: registration_number
                        code: required
                        message: A registered business needs its registration number.
                      - field: registration_authority
                        code: required
                        message: A registered business needs its registering authority.
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/seller/shops/{shopSlug}/shipping:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
    get:
      operationId: getShopShipping
      tags: [Seller]
      summary: Read the shop's delivery coverage, zone rates and estimates
      description: |
        Actor: the owner or any active member (`shop.member`, 07 §4.5). Scope: the shop comes from
        `{shopSlug}` only; another shop's slug, or one the caller is not in, answers the 404 of an
        unknown slug (06 §4.4, T-SEC-001). Status gate, the `shop.member` rule of 07 §4.4: open in
        `active` and in both suspension modes, to the owner only while `pending_review` or
        `rejected` (OD-47), and refused in `closed`, with 403 `SHOP_NOT_ACTIVE` and `shop_status`
        and `suspension_mode`. Query: none; any parameter is 400 `INVALID_QUERY_PARAMETER`
        (06 §6.3).
        Returns `coverage`, the covered district codes in code order; `rates`, one per zone in
        the zones' editor order (`delivery_zones.position`), each with its fee as Money and its
        delivery estimate in days; `configured`, the publish gate's "shipping is configured"
        condition (01 AC-FR-CAT-005-2, AC-FR-SHOP-004-3: at least one covered district and a rate
        for every covered district's zone); and `version`, `shops.version`, which the strong
        `ETag` repeats and `replaceShopShipping` takes as `If-Match` (06 §8). `updateShopProfile`
        moves the same version. Side effects: none. Charged to `api_user` (06 §9.1); past it,
        429. T-SHOP-010. Release R1·M2; built in R1-S part 1c.
      x-release: R1·M2
      x-permission: shop.member
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The shop's delivery configuration.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopShippingResponse' }
              examples:
                configured:
                  summary: A shop delivering to two districts, one in each zone (placeholders)
                  value:
                    data:
                      coverage: ['306', '405']
                      rates:
                        - zone_code: ktm_valley
                          fee: { amount_minor: 10000, currency: NPR }
                          est_min_days: 0
                          est_max_days: 1
                        - zone_code: outside_valley
                          fee: { amount_minor: 15000, currency: NPR }
                          est_min_days: 2
                          est_max_days: 5
                      configured: true
                      version: 3
                new:
                  summary: A shop that has set nothing yet
                  value:
                    data: { coverage: [], rates: [], configured: false, version: 1 }
        '400':
          description: A query parameter; the operation takes none, and one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      operationId: replaceShopShipping
      tags: [Seller]
      summary: Replace the shop's delivery coverage, or its zone rates and estimates
      description: |
        Actor: `shop.shipping.manage` (07 §4.5; AC-FR-SHOP-004-4). Status gate, the "profile,
        shipping" column of 07 §4.4: open while `active`, to the owner only while
        `pending_review` or `rejected` (OD-47, decided 2026-10-01, because approval needs
        coverage with rates), refused while `suspended` or `closed` (403 `SHOP_NOT_ACTIVE` with
        `shop_status` and `suspension_mode`). Scope: the shop comes from `{shopSlug}` only;
        another shop's slug answers the 404 of an unknown one (T-SEC-001). Query: none; any
        parameter is 400 `INVALID_QUERY_PARAMETER` (06 §6.3).
        Input: `coverage` and `rates`, each optional and each replaced whole when sent; an absent
        one keeps the saved set, so a form sends only the set it changed (06 note 65). Neither
        may be `null` (422 `required`). Any other member (`shop_id`, `version`, `configured`,
        ...), and any member of a rate other than its four, is 422 `unknown_field` (T-SEC-003).
        `coverage`: district codes, each once (`distinct`), each an active district of an active
        province with an active zone (else `not_offered` on `coverage.<i>`). `rates`: one per
        zone, each zone once (`distinct`) and active (else `not_offered` on
        `rates.<i>.zone_code`); `fee_minor` a JSON integer of paisa from 0 (free delivery) to
        99,999,999,999 (the most the form reads), never a float or a string (ADR-0007, 06 §3.3); `est_min_days` and `est_max_days` JSON integers
        from 0 (same day) to 30 [Assumption], the fastest no longer than the slowest
        (`less_than_min` on `rates.<i>.est_max_days`). On the result, the saved sets with the
        changes laid over them (04a §9.6, 05 §3.3 item 3): at least one covered district
        (`required` on `coverage`, AC-FR-SHOP-004-1) and a rate for every covered district's
        zone (`rate_required` on `rates`, naming the zone, T-SHOP-109), both over the covered
        districts the editor offers: a saved district no longer offered (it, its province or
        its zone made inactive) stays until the next coverage save, which must leave it out,
        and needs no rate. A rate for a zone the shop does not cover is kept.
        Order: the permission, the status gate, the members, the validator, then `If-Match`.
        Concurrency: ⟳ `If-Match` on `shops.version`, from `getShopShipping`'s `ETag` (the
        version `updateShopProfile` moves too). Missing, `*` or a list → 428; a stale version, a
        weak tag or any other value → 412 `VERSION_CONFLICT` with `current`, the shipping as
        `getShopShipping` shows it (06 §8). Not ⚷ (06 §7.7).
        Side effects, in one transaction: the shop row locked `FOR NO KEY UPDATE` (05 §4.4 level
        0) and the status gate checked again on it; each changed set deleted and re-inserted
        (`shop_delivery_coverage`, `shop_shipping_rates`; placed orders keep their fee and zone,
        AC-FR-SHOP-004-2); `version + 1` by compare-and-set on the version and status; one
        `shop.shipping_replace` audit row (proposed) with the from and to values of each set
        written (04a §15.3). A request that changes nothing writes nothing and keeps the
        version. Charged to `api_user` (06 §9.1). T-SHOP-010, T-SHOP-109, T-API-004, T-SEC-030,
        T-SEC-031. Release R1·M2; built in R1-S part 1c.
      x-release: R1·M2
      x-permission: shop.shipping.manage
      x-if-match: true
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceShopShippingRequest' }
            examples:
              firstSave:
                summary: The first save, both sets (placeholders)
                value:
                  coverage: ['306', '405']
                  rates:
                    - { zone_code: ktm_valley, fee_minor: 10000, est_min_days: 0, est_max_days: 1 }
                    - {
                        zone_code: outside_valley,
                        fee_minor: 15000,
                        est_min_days: 2,
                        est_max_days: 5,
                      }
              coverageOnly:
                summary: A later save of the coverage alone; the rates stay
                value:
                  coverage: ['306', '307', '308', '405']
      responses:
        '200':
          description: Saved; the shipping as `getShopShipping` shows it, with the new `ETag`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopShippingResponse' }
        '400':
          description: A query parameter; the operation takes none, and one `invalid` item names it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            `VALIDATION_FAILED`: a member out of rule (`array`, `regex`, `distinct`, `number`,
            `without_decimals`, `range`, `max_length`), a `null` (`required`), an unknown member
            (`unknown_field`), a district or zone that is not offered (`not_offered`), the slowest
            estimate shorter than the fastest (`less_than_min`), no covered district (`required`
            on `coverage`), or a covered zone without a rate (`rate_required` on `rates`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem422' }
              examples:
                rateRequired:
                  summary: Coverage reaching a zone that has no rate
                  value:
                    type: https://dripnepal.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: Some fields need attention.
                    code: VALIDATION_FAILED
                    request_id: 01929d01-0000-7000-8000-000000000427
                    errors:
                      - field: rates
                        code: rate_required
                        message: Outside Kathmandu Valley needs a fee and a delivery time, because you deliver to districts in it.
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/seller/shops/{shopSlug}/products:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
    get:
      operationId: listShopProducts
      tags: [Seller]
      summary: List the shop's products
      description: |
        Actor: `shop.products.view`; shop status gate of 07 §4.4: `active`, or `suspended` in
        either mode. Scope: the shop of `{shopSlug}`. Filters (06 §6.3): `status` (default: every
        product but the archived ones) and `q` (a title or SKU prefix, case-insensitive, 1 to 100
        characters). Sort `updated_desc`: newest change first, then `id`, by the cursor
        `(updated_at, id) < (:k0, :k1)` on `products_seller_list_idx` (04a §7.6). Pagination:
        cursor (06 §6.2), `limit` 1–100 (default 25), `meta` `CursorMeta`. The parameter list is
        closed: an unknown parameter, a value outside `status`, a `q` out of range or a foreign
        cursor is 400 `INVALID_QUERY_PARAMETER`. `variant_count` counts active variants. No side
        effects. T-CAT-010. Release R1·M3 (R1-S part 2a).
      x-release: R1·M3
      x-permission: shop.products.view
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: One page of products.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProductList' }
              examples:
                onePage:
                  summary: One draft (IDs illustrative)
                  value:
                    data:
                      - id: 01929a50-2c3d-7e4f-8a90-1b2c3d4e5f60
                        public_id: 7K3M9QXA
                        title: Organic cotton crew tee
                        status: draft
                        version: 1
                        variant_count: 1
                        updated_at: '2026-11-24T06:00:00.000Z'
                    meta: { limit: 25, next_cursor: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createProduct
      tags: [Seller]
      summary: Create a draft product
