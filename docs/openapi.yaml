              examples:
                onePage:
                  summary: One shop-owned NCM account (IDs illustrative)
                  value:
                    data:
                      - id: 01929c10-0000-7000-8000-0000000000a1
                        provider_code: ncm
                        owner_type: shop
                        name: Example NCM account
                        environment: production
                        external_account_ref: null
                        status: active
                        verified_at: '2026-11-12T05:10:00.000Z'
