      description: |
        Proposed (06 §13.8); waits for the product owner's approval.
        Actor: platform staff with `platform.logistics.manage` (proposed) and MFA verified
        within 12 h (06 §4.3). Scope: staff see every account, platform- and shop-owned.
        Filters: `owner_type` and `status`. Sort `created_at` ascending, then `id`.
        Pagination: cursor (06 §6.2), with `limit` 1–100 (default 25) and `meta` `CursorMeta`.
        The parameter list is closed (06 §6.3): an unknown parameter, a parameter sent twice, a
        value outside a filter's enum, a `limit` out of range, or a cursor that does not decode,
        names another sort or was made for other filters is 400 `INVALID_QUERY_PARAMETER`.
        Each account carries `shop_id` (the owning shop; `null` for a platform-owned account)
        and `shops`, its `logistics_account_shops` rows (04a §9.10), and never its credentials
        or their ciphertext (07 TM-32, T-SEC-040). Side effects: none. Release R1·M6.
      x-release: R1·M6
      x-proposed: true
      x-permission: platform.logistics.manage
      parameters:
        - name: owner_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CourierAccountOwnerType' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CourierAccountStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
