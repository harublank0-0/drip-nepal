  /api/v1/seller/shops/{shopSlug}/logistics:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
    get:
      operationId: getLogisticsSettings
      tags: [Seller]
      summary: Read the shop's courier settings, accounts and pickup addresses (proposed)
      description: |
        Proposed (06 §13.8); waits for the product owner's approval.
        Actor: `shop.shipping.manage` (owner, manager); shop status gate `active` only, as the
        profile and shipping column of 07 §4.4 (403 `SHOP_NOT_ACTIVE` otherwise). Scope: the
        shop comes from `{shopSlug}` only; the accounts are those with an active
        `logistics_account_shops` row for the shop (04a §9.10), so a `disabled` account, whose
        rows are deactivated, is not listed; every other status is.
        Returns the settings (a shop with no `shop_logistics_settings` row is `manual`,
        enabled, `version` 0; 04a §9.11), each account without its credentials or their
        ciphertext (07 TM-32, T-SEC-040), and the live pickup addresses with the contact phone,
        area and landmark in full, as the shop's own data (07 §5.5, T-SEC-034).
        `callback_url` is the URL the owner registers with the courier for its status callbacks
        (06 §12.6). It carries the account's callback token, so only the owner sees it; it is
        `null` for every other member, for a platform-owned account (staff register its callback;
        OD-58) and when no callback key is configured, and it is never stored with an idempotency
        key.
        `ETag` is the settings `version` (`"0"` before the first save), which
        `replaceLogisticsSettings` sends back as `If-Match`. Side effects: none. Release R1·M6.
      x-release: R1·M6
      x-proposed: true
      x-permission: shop.shipping.manage
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The settings, the accounts the shop may use and its live pickup addresses.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopLogisticsResponse' }
              examples:
                ownerView:
                  summary: The owner's view after one NCM account was verified (IDs, names and the token are placeholders)
                  value:
                    data:
                      settings:
                        fulfillment_mode: vendor
                        default_account_id: 01929c10-0000-7000-8000-0000000000a1
                        is_enabled: true
                        version: 2
                      accounts:
                        - id: 01929c10-0000-7000-8000-0000000000a1
                          provider_code: ncm
                          owner_type: shop
                          name: Example NCM account
                          environment: production
                          external_account_ref: null
                          status: active
                          verified_at: '2026-11-12T05:10:00.000Z'
                          disabled_at: null
                          version: 2
                          callback_url: https://dripnepal.com/api/v1/webhooks/couriers/ncm/01929c10-0000-7000-8000-0000000000a1?token=EXAMPLE-NOT-A-REAL-TOKEN
                      pickup_addresses:
                        - id: 01929c11-0000-7000-8000-0000000000b1
                          label: Workshop
                          contact_name: Example Contact
                          contact_phone: '9800000000'
                          province_code: '3'
                          district_code: '305'
                          local_level_code: '30501'
                          ward_no: 4
                          area_tole: Example Tole
                          street_landmark: null
                          postal_code: '3050104'
                          is_default: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      operationId: replaceLogisticsSettings
      tags: [Seller]
      summary: Set the fulfilment mode and default courier account (proposed)
      description: |
        Proposed (06 §13.8); waits for the product owner's approval.
        Actor: `shop.shipping.manage`; shop status gate `active` only (07 §4.4). Scope: the
        shop comes from `{shopSlug}` only; `shop_id`, `is_enabled` and `version` are not inputs
        (422 `unknown_field`, 06 §3.5).
        Rules (04a §9.11): `manual` takes no `default_account_id` (422 `not_allowed`); `vendor`
        requires one (422 `required`), which must have an active `logistics_account_shops` row
        for the shop, be `active` and be shop-owned (422 `account_not_usable`). `platform`
        also requires one, platform-owned and allowed for the shop, and a shop with an active
        account of its own gets 422 `own_account_active` on `fulfillment_mode` (OD-58,
        re-decided 2026-11-22).
        Concurrency: ⟳ `If-Match` on `shop_logistics_settings.version`; a first save, before
        the row exists, sends `If-Match: "0"`. Missing, `*` or a list → 428; a stale version, a
        weak tag or any other value → 412 `VERSION_CONFLICT` with `current`, the settings as
        this operation returns them (06 §8). Not ⚷ (06 §7.7).
        Side effects, in one transaction with the shop row locked first (05 §4.4 level 0): the
        settings row inserted (`version` 1) or updated (`version` + 1); audit
        `shop_logistics_settings.update`. T-SHOP-115. Release R1·M6.
      x-release: R1·M6
      x-proposed: true
      x-permission: shop.shipping.manage
      x-if-match: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceLogisticsSettingsRequest' }
            examples:
              firstSave:
                summary: First save with `If-Match` `"0"`, booking with the shop's own NCM account
                value:
                  fulfillment_mode: vendor
                  default_account_id: 01929c10-0000-7000-8000-0000000000a1
              backToManual:
                summary: Back to recording shipments by hand
                value: { fulfillment_mode: manual, default_account_id: null }
      responses:
        '200':
          description: The settings after the change, with the new `ETag`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogisticsSettingsResponse' }
              examples:
                saved:
                  summary: After the first save
                  value:
                    data:
                      fulfillment_mode: vendor
                      default_account_id: 01929c10-0000-7000-8000-0000000000a1
                      is_enabled: true
                      version: 1
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/seller/shops/{shopSlug}/courier-accounts:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
    post:
      operationId: createShopCourierAccount
      tags: [Seller]
      summary: Add the shop's own courier account (proposed)
      description: |
        Proposed (06 §13.8; OD-56); waits for the product owner's approval.
        Actor: `shop.courier_accounts.manage` (proposed; the owner only, 07 §4.3) with password
        re-entry (07 §3.6, §3.10; T-SEC-041); shop status gate `active` only, as the payout
        account column of 07 §4.4. Scope: the account is created for the shop of `{shopSlug}`
        with `owner_type = 'shop'`.
        Rules: `provider_code` names an active courier that has an adapter, else 422
        `provider_inactive`; a `sandbox` account in production is 422 `sandbox_in_production` on
        `environment`; an `external_account_ref` already registered for that courier and
        environment is 422 `already_registered`, checked before the insert. `credentials` are
        the courier's documented fields: for NCM a `token` [Verify-external VX-16].
        Password: checked after the `Idempotency-Key` and before the transaction. A wrong one is
        422 `password_incorrect` on `password` with an `auth.reauth_failed` audit row; the
        `reauth_user` (5 per 15 minutes) and `reauth_user_day` (10 per 24 hours) limiters are
        charged before the check (429), and the tenth wrong password in 24 hours rotates the
        account's `security_stamp`, which ends its sessions.
        Side effects, in one transaction: the `logistics_accounts` row (`pending`, credentials
        encrypted in `credentials_enc`) and its owner row in `logistics_account_shops`; audit
        `logistics_account.create`, never the credentials; job `logistics.verify_account`, which
        makes the account `active` or `invalid` (T-SHOP-116).
        Idempotency: ⚷, 24 h; the fingerprint leaves out `password`, and the stored response
        holds no credentials. Returns 201 without `Location` (no read operation serves one
        account, 06 §3.7). Release R1·M6.
      x-release: R1·M6
      x-proposed: true
      x-permission: shop.courier_accounts.manage
      x-idempotency: { required: true, retention_hours: 24 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShopCourierAccountRequest' }
            examples:
              ncm:
                summary: The shop's NCM account (the token and the password are placeholders)
                value:
                  provider_code: ncm
                  name: Example NCM account
                  environment: production
                  external_account_ref: null
                  credentials: { token: EXAMPLE-NOT-A-REAL-TOKEN }
                  password: example-current-password
      responses:
        '201':
          description: |
            The account in `pending`, without credentials. A replay of the same key and body
            returns this 201 again with `Idempotency-Replayed: true` (06 §7.4).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourierAccountResponse' }
              examples:
                pending:
                  summary: Waiting for `logistics.verify_account`
                  value:
                    data:
                      id: 01929c10-0000-7000-8000-0000000000a1
                      provider_code: ncm
                      owner_type: shop
                      name: Example NCM account
                      environment: production
                      external_account_ref: null
                      status: pending
                      verified_at: null
                      disabled_at: null
                      version: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

