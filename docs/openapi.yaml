paths:
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      tags: [Public]
      summary: Storefront listing and search
      description: |
        Actor: anyone; a session, if present, is ignored for authorization (06 §2.2).
        Scope: only `product_listings` rows (published product, `active` shop, ready image).
        Pagination: page numbers (06 §6.1); ordering is the chosen sort key, then `product_id`
        (AC-FR-SRCH-001-2), so pages never repeat a row. A page beyond the last returns
        200 with empty `data`. `meta.total` is a capped count (at most 10,000, then
        `total_is_capped: true`) [Assumption].
        Filters and sorts are a closed allowlist (06 §6.3); anything else, or a repeated
        parameter with more than 20 values, is 400 `INVALID_QUERY_PARAMETER`. Attribute filters
        are named by the filterable attribute's code with value codes.
        Side effects: none. Rate limit `catalog_ip` 120/min per IP [Assumption].
        `Cache-Control: private, no-store` in R1 (06 §3.8). Release R1·M4.
      x-release: R1·M4
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: category
          in: query
          description: Category slug; matches the category and its subtree.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: nav
          in: query
          description: Navigation entry slug (for example the entry behind `/men/t-shirts`, 03 §6.1).
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: audience
          in: query
          description: Attribute filter `audience` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: apparel_size
          in: query
          description: Attribute filter `apparel_size` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: shoe_size_eu
          in: query
          description: Attribute filter `shoe_size_eu` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: waist_size_in
          in: query
          description: Attribute filter `waist_size_in` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: color
          in: query
          description: Attribute filter `color` (value codes, repeatable).
          style: form
          explode: true
          schema: { $ref: '#/components/schemas/AttributeValueCodeList' }
        - name: brand
          in: query
          description: Brand slug (`brands_slug_check`, 3–40 characters, 04a §7.5).
          schema: { type: string, minLength: 3, maxLength: 40 }
        - name: shop
          in: query
          description: Shop slug.
          schema: { type: string, minLength: 3, maxLength: 40 }
        - name: price_min_minor
          in: query
          description: Lower bound of the variant price in paisa.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: price_max_minor
          in: query
          description: Upper bound of the variant price in paisa.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: in_stock
          in: query
          description: Only listings with at least one available variant.
          schema: { type: boolean }
        - name: q
          in: query
          description: Free-text search, 2–100 characters (GIN search on `product_listings`).
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: sort
          in: query
          description: Default `newest`; `relevance` only with `q`, and then it is the default.
          schema: { $ref: '#/components/schemas/ListingSort' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of listing cards.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingCardPage' }
              examples:
                page2:
                  summary: 06 §14.1, page 2 of men's M t-shirts by price
                  value:
                    data:
                      - public_id: 7K3M9QXA
                        slug: organic-cotton-crew-tee
                        title: Organic cotton crew tee
                        shop: { slug: kathmandu-threads, name: Kathmandu Threads }
                        brand: null
                        price_min: { amount_minor: 129900, currency: NPR }
                        price_max: { amount_minor: 139900, currency: NPR }
                        compare_at: { amount_minor: 159900, currency: NPR }
                        in_stock: true
                        image:
                          alt: Black crew tee, front
                          srcset_keys:
                            '320': p/7K3M9QXA/1-320.webp
                            '640': p/7K3M9QXA/1-640.webp
                        published_at: '2026-10-01T04:10:00.000Z'
                    meta:
                      { page: 2, per_page: 24, total: 25, total_is_capped: false, has_more: false }
        '400':
          description: Unknown, malformed or out-of-range query parameter.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem400' }
              examples:
                unknownSort:
                  summary: 06 §14.1, `sort=popular`
                  value:
                    type: https://dripnepal.com/problems/invalid-query-parameter
                    title: Invalid query parameter
                    status: 400
                    detail: sort must be one of newest, price_asc, price_desc, relevance.
                    code: INVALID_QUERY_PARAMETER
                    request_id: 01929a4e-9d02-7a41-8c33-0e5b6f7a8b90
                    errors:
                      - { field: sort, code: enum, message: Unsupported sort. }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/seller/shops/{shopSlug}/products:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
    post:
      operationId: createProduct
      tags: [Seller]
      summary: Create a draft product
      description: |
        Actor: shop owner or member with `shop.products.edit`; shop status gate of 06 §4.4
        (only `active` allows it). Scope: the shop comes from `{shopSlug}` only; `shop_id`,
        `status`, `version`, `public_id` and `created_by` are server-owned and sending any of
        them is 422 `VALIDATION_FAILED` with `errors[].code = "unknown_field"` (06 §3.5, T-SEC-003).
        `category_id` must be an active leaf category; the s6 disclosure fields may be null
        on a draft and are required at submit (04a §7.6, FR-CAT-012).
        Side effects: product row `draft`, `version` 1, audit. Idempotency: ⚷, 24 h.
        Body limit 512 KB (06 §9.2). Returns 201 with `Location` and `ETag: W/"1"`. Release R1·M3.
      x-release: R1·M3
      x-permission: shop.products.edit
      x-idempotency: { required: true, retention_hours: 24 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
            examples:
              tee:
                summary: 06 §14.2
                value:
                  title: Organic cotton crew tee
                  description: 180 gsm, pre-shrunk.
                  category_id: 01928f00-1111-7000-8000-00000000a001
                  brand_id: null
                  attributes:
                    - { attribute_code: audience, value_codes: [men, women] }
                    - { attribute_code: material, value_codes: [cotton] }
                  manufacturer_name: Kathmandu Threads Pvt. Ltd.
                  is_imported: false
                  country_of_origin: null
                  warranty_text: null
                  care_and_precautions: Wash cold, dry in shade.
      responses:
        '201':
          description: |
            Draft created. A replay of the same key and body returns this 201 again with
            `Idempotency-Replayed: true` (06 §7.4).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProductResponse' }
              examples:
                created:
                  summary: 06 §14.2
                  value:
                    data:
                      id: 01929a50-2c3d-7e4f-8a90-1b2c3d4e5f60
                      public_id: 7K3M9QXA
                      status: draft
                      version: 1
                      title: Organic cotton crew tee
                      category:
                        { id: 01928f00-1111-7000-8000-00000000a001, path: /clothing/tops/t-shirts/ }
                      variants: []
                      media: []
                      missing_for_submit: [variants, media]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/seller/shops/{shopSlug}/products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
      - $ref: '#/components/parameters/ProductId'
    put:
      operationId: replaceProductVariants
      tags: [Seller]
      summary: Set option axes and the whole variant set
      description: |
        Actor: `shop.products.edit`; shop status gate of 06 §4.4. Scope: `{productId}` is
        looked up inside the shop; another shop's product is 404 (T-SEC-001).
        Whole-set replacement (PUT): variants carrying an `id` are updated, variants without
        one are created with an `inventory_items` row at 0, and variants left out are archived
        (or deleted if never stocked, 04a §7.9). Validation: no duplicate combination, SKU
        unique per shop among active variants (`product_variants_shop_sku_key` → 422 on
        `variants.N.sku`, code `unique`), `compare_at_price_minor` > `price_minor`, at most 100 variants
        (`is_default` is not an input: the server sets it true only for the single option-less
        variant, `product_variants_default_signature_check`), `price_minor` 0–100,000,000 paisa (04a §7.9);
        a product in `pending_review`, `published` or `unpublished` keeps at least one active
        variant and every active variant priced above zero (AC-FR-CAT-004-3). An `id` naming an
        archived variant of this product re-activates it; at most two option axes, which may be
        reordered in place (04a §7.8). Removing or replacing an axis once a variant of the product
        has an inventory movement or an order line answers 409 `CONFLICT` (axis set frozen, 04a §7.8).
        Concurrency: ⟳ `If-Match` on `products.version`; bumps it and each changed variant's
        `version`. Missing → 428; stale → 412 with `current`. Not ⚷ (the version check stops a
        second apply, 06 §7.7). Body limit 512 KB. Release R1·M3.
      x-release: R1·M3
      x-permission: shop.products.edit
      x-if-match: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceProductVariantsRequest' }
            examples:
              sizeAndColor:
                summary: 06 §14.2
                value:
                  option_axes: [apparel_size, color]
                  variants:
                    - option_value_codes: { apparel_size: m, color: black }
                      sku: KT-TEE-M-BLK
                      price_minor: 129900
                      compare_at_price_minor: 159900
                      weight_grams: 220
                    - option_value_codes: { apparel_size: l, color: black }
                      sku: KT-TEE-L-BLK
                      price_minor: 139900
                      compare_at_price_minor: null
                      weight_grams: 240
      responses:
        '200':
          description: The product with its new variant set and the new `ETag`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProductResponse' }
              examples:
                replaced:
                  summary: 06 §14.2 (fields 06 abbreviates are filled in, per 06 §3.3)
                  value:
                    data:
                      id: 01929a50-2c3d-7e4f-8a90-1b2c3d4e5f60
                      public_id: 7K3M9QXA
                      status: draft
                      version: 2
                      title: Organic cotton crew tee
                      category:
                        { id: 01928f00-1111-7000-8000-00000000a001, path: /clothing/tops/t-shirts/ }
                      variants:
                        - id: 01929a51-0000-7000-8000-0000000000b1
                          sku: KT-TEE-M-BLK
                          label: 'Size: M / Color: Black'
                          price: { amount_minor: 129900, currency: NPR }
                          is_default: false
                          on_hand: 0
                        - id: 01929a51-0000-7000-8000-0000000000b2
                          sku: KT-TEE-L-BLK
                          label: 'Size: L / Color: Black'
                          price: { amount_minor: 139900, currency: NPR }
                          is_default: false
                          on_hand: 0
                      media: []
                      missing_for_submit: [media]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/v1/seller/shops/{shopSlug}/inventory/{variantId}/adjustments:
    parameters:
      - $ref: '#/components/parameters/ShopSlug'
      - $ref: '#/components/parameters/VariantId'
    post:
      operationId: adjustInventory
      tags: [Seller]
      summary: Signed stock adjustment
      description: |
        Actor: `shop.inventory.adjust`; shop status gate of 06 §4.4. Scope: `{variantId}` is
        looked up inside the shop, else 404 (T-SEC-001).
        Rules (05 §5.9): `delta` ≠ 0; the result may not take `on_hand` below `reserved`
