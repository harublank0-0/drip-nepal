        member. At most 20 rows, the first by name (A-63), so it is a bounded list (06 §6.2) and
        answers `{ "data": [...] }` without `meta` or a cursor. Query: none; any parameter is 400
        `INVALID_QUERY_PARAMETER` (06 §6.3). Side effects: none. Charged to `api_user`
        (06 §9.1); past it, 429. T-SHOP-008. Release R1·M2; built in R1-S part 1a.
      x-release: R1·M2
      security:
        - cookieAuth: []
      parameters:
