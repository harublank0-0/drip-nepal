openapi: 3.1.0
info:
  title: DripNepal API
  version: 1.0.0-draft
  summary: JSON API under /api/v1 of the DripNepal multi-vendor fashion marketplace (foundation contract).
  description: |
    Status: Draft v1 (2026-09-26)

    Reviewed: critic pass B2 (2026-09-26)

    This is the FOUNDATION contract chosen by the product owner on 2026-09-26 (option B):
    the shared contract is complete now, and the remaining endpoints are added in the PR
    that implements each one. The human catalogue and every rule are in
    [06-api-design.md](06-api-design.md); where the two differ, 06 states the intent and this
    file is corrected in the same PR (06 introduction).

    **Per-PR rule.** Only the operations listed under `x-foundation-scope` are specified here;
    every other operation in 06 §13 is added to this file in the same PR that implements it;
    T-API-001 fails for any /api/v1 response whose operation is missing from this file.
    `x-pending-operations` lists those operations, so the rule is checkable:
    `x-foundation-scope` ∪ `x-pending-operations` equals the operationIds of 06 §13, and an
    operationId moves from the pending list to `paths` in the implementing PR.

    **Conventions (06 §3).** JSON keys are `snake_case` (OD-13, decided 2026-09-30). Money is
    `{ "amount_minor": <integer paisa>, "currency": "NPR" }` (ADR-0007); request money is a
    bare integer field ending in `_minor`. Timestamps are RFC 3339 UTC with `Z` and millisecond
    precision. IDs are UUID strings; orders use `DN-XXXXXXX`, shop orders `DN-XXXXXXX-n`,
    returns `RT-XXXXXXX`, support cases `SC-XXXXXXX`, storefront products an 8-character
    Crockford base32 `public_id`. Enums are lower `snake_case` exactly as the 04a CHECK lists;
    clients must tolerate unknown enum values and unknown response fields (06 §10). Every
    documented response field is always present; unknown values are `null` (06 §3.3).

    **Envelope (06 §3.4).** One resource: `{ "data": {...} }`. Lists: `{ "data": [...], "meta": {...} }`
    where `meta` is `PageMeta` (public catalog only) or `CursorMeta` (every other list).
    `204 No Content` only for `DELETE` endpoints and `logOut`. Errors are RFC 9457
    `application/problem+json` (`Problem`, 06 §5; ADR-0018).

    **Authentication (06 §4).** Session cookie `dripnepal_session` (ADR-0005). Unsafe methods
    also need the `X-XSRF-TOKEN` header, which Tuyau and Inertia's axios copy from the
    `XSRF-TOKEN` cookie. Public operations declare `security: []`. Admin operations also need
    a `platform_staff` row and MFA verified within 12 hours; non-staff callers get 404
    [Assumption; 07 confirms].
    Seller operations resolve `{shopSlug}` server-side (06 §4.4): unknown shop or non-member
    → 404, missing permission → 403 `FORBIDDEN`, shop status gate → 403 `SHOP_NOT_ACTIVE`.

    **Idempotency (06 §7).** Operations marked `x-idempotency.required: true` need an
    `Idempotency-Key` header (16–64 of `[A-Za-z0-9_-]`, one key per user intent). Missing or
    malformed → 400 `IDEMPOTENCY_KEY_REQUIRED`. Same key and same fingerprint after commit →
    the stored status and body with `Idempotency-Replayed: true`. Same key, different
    fingerprint → 422 `IDEMPOTENCY_KEY_REUSED`. Same key still running after 5 s → 409
    `IDEMPOTENCY_IN_PROGRESS` with `Retry-After: 2`. A business failure inside the transaction
    stores nothing, so a retry re-executes. Retention 24 h (72 h for `placeOrder`).

    **Concurrency (06 §8).** Operations marked `x-if-match: true` need `If-Match: W/"<version>"`:
    missing → 428 `PRECONDITION_REQUIRED`; stale → 412 `VERSION_CONFLICT` with `current`.

    **Extensions used on operations.** `x-release` (release and milestone from 06 §13),
    `x-permission` (canon §7 slug; seller slugs `shop.*`, admin slugs `platform.*`),
    `x-idempotency` (`required`, `retention_hours`), `x-if-match`, `x-proposed` (true for an
    operation that is "proposed; not yet in canon §6.5" and waits for the product owner's approval).
    `x-page-route: true` marks a documented Inertia page route (no operationId, not JSON, outside
    T-API-001); such routes are listed in the top-level `x-foundation-page-routes`.
  contact:
    name: DripNepal engineering (docs/06-api-design.md owners)
  license:
    name: Proprietary (internal draft)
    identifier: LicenseRef-DripNepal-Internal
servers:
  - url: http://localhost:3333
    description: Local development (`HOST`/`PORT` defaults of `.env.example`) [Verified-repo]
  - url: https://{stagingHost}
    description: Staging (placeholder; host decided by docs/11) [Assumption]
    variables:
      stagingHost:
        default: staging.dripnepal.com
  - url: https://dripnepal.com
    description: Production (placeholder domain, 06 §5.1 and §14) [Assumption]
tags:
  - name: Public
    description: Unauthenticated catalog, shop and location reads (06 §13.2). Rate limited per IP.
  - name: Auth
    description: Sign-up, sign-in, MFA, email verification and password reset (06 §13.3).
  - name: Me
    description: The signed-in user's profile, addresses, sessions and support cases (06 §13.3–§13.4).
  - name: Cart & Checkout
    description: Cart, `quoteCheckout` and `placeOrder` (06 §13.4, 05 §4).
  - name: Customer Orders
    description: The customer's own orders, cancellations and payment attempts (06 §13.4, §4.5).
  - name: Shop Applications
    description: Applying for a shop and joining one by invitation (06 §13.4).
  - name: Seller
    description: Everything under `/api/v1/seller/shops/{shopSlug}` (06 §13.5, §4.4).
  - name: Admin
    description: Everything under `/api/v1/admin`; platform staff with fresh MFA (06 §13.6, §4.3).
  - name: Provider returns
    description: Payment-provider return page and the reserved webhook (06 §12, §13.7; R1.1).
security:
  - cookieAuth: []
    xsrfHeader: []

