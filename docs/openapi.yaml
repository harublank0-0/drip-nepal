    get:
      operationId: getSellerShop
      tags: [Seller]
      summary: Read the shop's profile, status and agreement status
      description: |
        Actor: the owner or any active member (`shop.member`, 07 §4.5). Scope: the shop comes from
        `{shopSlug}` only; another shop's slug, or one the caller is not in, answers the 404 of an
        unknown slug (06 §4.4, T-SEC-001). Status gate, the `shop.member` rule of 07 §4.4
        (proposed, OD-48): open in `active` and in both suspension modes, to the owner only while
        `pending_review` or `rejected`, and refused in `closed`, with 403 `SHOP_NOT_ACTIVE` and
        `shop_status` and `suspension_mode`. Query: none; any parameter is 400
        `INVALID_QUERY_PARAMETER` (06 §6.3).
        Returns the profile, the status, `agreement` (the current seller agreement's `version`
        and `is_final`, and `accepted`, whether the shop holds a `shop_agreements` row for it,
        04a §6.4) and `version`, which the strong `ETag` repeats and `updateShopProfile` takes as
        `If-Match` (06 §8). `business_details` (the business details of 01 AC-FR-SHOP-013-2:
        business type, registration number, registering authority, PAN/VAT number, VAT flag and
        return policy) and `grievance_contact` (name and phone, decrypted by the shop profile
        transformer of the 07 §5.5 allowlist) are the owner's only: `null` for every other member
        (01 AC-FR-SHOP-013-4, T-SEC-034). The logo and banner join with FR-MED-003. Side effects:
        none. Charged to `api_user` (06 §9.1); past it, 429. T-SHOP-008. Release R1·M2; built in
        R1-S part 1a.
      x-release: R1·M2
