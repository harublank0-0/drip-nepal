          description: |
            The shipment: the new `pending` one after a `booking_failed` cancellation, or the
            `booked` one with the cancellation requested. A replay of the same key and body
            returns this 200 again with `Idempotency-Replayed: true` (06 §7.4).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
