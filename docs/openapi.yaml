  /api/v1/checkout/orders:
    post:
      operationId: placeOrder
      tags: [Cart & Checkout]
      summary: Place the order for the whole cart
      description: |
        Actor: customer, `active`, verified email, Nepal mobile number on the account (else
        422 on `phone`, 05 §4.1). Scope: own active cart and own, non-archived address; another
        customer's or an archived `address_id` is 404 (T-SEC-006; 05 §4.1). The body carries no
        prices, totals, quantities, shop IDs or commission; the server reads them from the cart
        and catalog, and any extra field is 422 `unknown_field` (T-SEC-003).
        Algorithm: 05 §4.3 steps 2–10 in one transaction with the idempotency key row as its
        first statement (06 §7.3): cart version guard (409 `CART_CHANGED`), price guard against
        `expected_grand_total_minor` (409 `PRICE_CHANGED` with `quote`), delivery coverage (422
        `DELIVERY_NOT_AVAILABLE`), COD limits (422 `COD_LIMIT_EXCEEDED`, Open OD-18),
        conditional stock update (409 `OUT_OF_STOCK` with per-line `errors[]`, T-INV-003).
        One order, one shop order per shop, reservations, COD payment rows; jobs are sent in
        the same transaction (03 §9).
        Idempotency: ⚷, 72 h [Assumption A-32]. Missing key → 400 `IDEMPOTENCY_KEY_REQUIRED`
        (AC-FR-CHK-003-1). A business failure stores nothing, so a retry re-executes. A replay
        returns the byte-identical 201 with `Idempotency-Replayed: true` (T-CHK-004); for a
        gateway order the stored body never contains a payment redirect (05 §4.6).
        Kill switch: 503 `PROVIDER_UNAVAILABLE` with the `maintenance_banner` text and no
        `Retry-After` (06 §5.2).
        Rate limit `place_order` 10/min per user; a replay still consumes a point [Assumption].
        Release R1·M5 (COD); gateway methods R1.1·M8.
      x-release: R1·M5
      x-idempotency: { required: true, retention_hours: 72 }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
            examples:
