        `logistics.verify_account`) only from `suspended`; `disabled` from any status but
        `disabled`, with the effects of `disableShopCourierAccount` (credentials erased, the
        account's `logistics_account_shops` rows deactivated, a shop whose default it was back
        to `manual`), refused while a parcel on the account is not finished. Any other request
        is 409 `INVALID_STATE_TRANSITION` with the `allowed_events` of the current status.
        Side effects: `version` + 1; audit `logistics_account.status_change` with `reason`.
        Not ⚷, not ⟳. T-SEC-041, T-SHOP-116, T-SEC-045. Release R1·M6.
