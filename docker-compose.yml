# Development only (docs/11 §4.3, RF-43). Staging and production use
# deploy/compose.yml (docs/11 §4.5). Compose reads DB_PASSWORD from .env,
# and every port listens on this machine only.
services:
  postgres:
    image: docker.io/postgres:18.4
    container_name: dripnepal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dripnepal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: dripnepal_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      # Creates the roles and dripnepal_test on an empty volume (RF-32).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dripnepal -d dripnepal_dev']
      interval: 5s
      retries: 10

  # Mail capture for development. Nothing sends email yet: @adonisjs/mail
  # returns with M1's notifications work (docs/12 §5.1), which uses it.
  mailpit:
    image: docker.io/axllent/mailpit:v1.33.1
    container_name: dripnepal-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  # S3-compatible storage for development and for T-MED-005, which runs the
  # S3 adapter against it in CI too (OD-65, decided 2026-11-25; docs/11
  # §2.2). SeaweedFS in its all-in-one `mini` mode, with only the S3 port
  # published. Its other ports (filer, master, volume) have no
  # authentication and stay reachable from other containers on the Compose
  # network: fine for a development store with public credentials, never
  # for anything else. The four buckets are created at start, and a write
  # to any other bucket fails, as on R2; the health check passes only once
  # all four exist. docker/seaweedfs/s3.json holds the development
  # credentials (public placeholder values, not secrets) and the anonymous
  # read of the two public buckets.
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.53
    container_name: dripnepal-seaweedfs
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.autoCreateBucket=false
      - -bucket=dripnepal-dev-private,dripnepal-dev-public,dripnepal-test-private,dripnepal-test-public
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8333/healthz &&
          for bucket in dripnepal-dev-private dripnepal-dev-public dripnepal-test-private dripnepal-test-public;
          do wget -q -O /dev/null "http://127.0.0.1:8888/buckets/$$bucket/" || exit 1; done
      interval: 5s
      retries: 20

  # Nothing in R1 uses Redis (docs/11 §2.2): start it with
  # `docker compose --profile redis up -d` when a spike needs it.
  redis:
    image: docker.io/redis:8.6
    container_name: dripnepal-redis
    profiles: [redis]
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  postgres_data:
  seaweedfs_data:
